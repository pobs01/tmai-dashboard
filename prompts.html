<!DOCTYPE html>
<html class="scroll-smooth dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompts Tool — TMAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
    darkMode: "class",
    theme: { extend: { colors: { "background": "#0F172A", "surface": "#0F172A", "surface-container": "#1E293B", "surface-container-low": "#131C31", "surface-container-lowest": "#0F172A", "text-muted": "#94A3B8", "secondary": "#00D1FF", "outline-variant": "#334155", "on-background": "#F8FAFC", "on-primary-container": "#CBD5E1", "primary": "#FFFFFF", "error": "#ef4444" }, fontFamily: { "display-lg": ["Space Grotesk"], "headline-md": ["Space Grotesk"], "headline-sm": ["Space Grotesk"], "body-lg": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "label-md": ["Inter"] } } }
}
</script>
<style>
body { background: #0F172A; color: #F8FAFC; font-family: 'Inter', sans-serif; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.prompt-card { background: #131C31; border: 1px solid #334155; border-radius: 12px; padding: 20px; transition: all 0.2s; cursor: pointer; }
.prompt-card:hover { border-color: rgba(0,209,255,0.3); transform: translateY(-2px); }
.account-item { padding: 10px 16px; border-radius: 8px; font-size: 13px; color: #94A3B8; cursor: pointer; transition: all 0.15s; }
.account-item:hover, .account-item.active { background: rgba(0,209,255,0.1); color: #00D1FF; }
.channel-tab { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #94A3B8; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.channel-tab:hover { color: #F8FAFC; }
.channel-tab.active { color: #00D1FF; background: rgba(0,209,255,0.1); border-color: rgba(0,209,255,0.3); }
.cat-pill { padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 700; color: #94A3B8; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px; letter-spacing: 0.01em; }
.cat-pill:hover { color: #F8FAFC; background: rgba(255,255,255,0.05); }
.cat-pill.active { color: #00D1FF; background: rgba(0,209,255,0.15); border-color: rgba(0,209,255,0.4); font-size: 15px; }
.cat-pill .pill-count { background: rgba(0,209,255,0.2); padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; }
#signIn { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
#app { display: none; min-height: 100vh; }
.btn-copy { background: rgba(0,209,255,0.1); border: 1px solid rgba(0,209,255,0.3); color: #00D1FF; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn-copy:hover { background: rgba(0,209,255,0.2); }
.btn-execute { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #22c55e; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn-execute:hover { background: rgba(34,197,94,0.25); }
.btn-execute:disabled { opacity: 0.4; cursor: not-allowed; }
.date-pill { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #94A3B8; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; background: rgba(255,255,255,0.03); }
.date-pill:hover { color: #F8FAFC; background: rgba(255,255,255,0.06); }
.date-pill.active { color: #00D1FF; background: rgba(0,209,255,0.15); border-color: rgba(0,209,255,0.4); }
</style>
</head>
<body>

<!-- SIGN IN SCREEN -->
<div id="signIn">
<div class="text-center">
<div class="font-display-lg text-3xl font-bold mb-6">TMAI <span class="text-secondary">Prompts</span></div>
<p class="text-text-muted mb-8 max-w-md mx-auto">Access your AI prompt library — curated prompts for Google Ads, GA4, and Staff Dashboards.</p>
<div id="authStatus" class="text-sm text-text-muted mb-4"></div>
<div id="loginButtons">
<button onclick="googleSignIn()" class="inline-flex items-center gap-2 bg-secondary text-background font-bold px-8 py-3 rounded-lg hover:translate-y-[-2px] transition-all">
<span class="material-symbols-outlined">login</span> Sign in with Google
</button>
<p class="text-xs text-text-muted mt-3">Restricted to <code class="text-secondary">pbs@tmicollective.com</code></p>
</div>
</div>
</div>

<!-- MAIN APP -->
<div id="app" class="flex">
<!-- Left Sidebar -->
<aside id="sidebar" class="w-64 bg-surface-container-low border-r border-outline-variant flex flex-col min-h-screen">
<div class="p-4 border-b border-outline-variant">
<div class="font-display-lg text-lg font-bold">TMAI <span class="text-secondary">Prompts</span></div>
<div id="userEmail" class="text-xs text-text-muted mt-1"></div>
<button onclick="signOut()" class="text-xs text-text-muted hover:text-secondary mt-2 flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size:14px">logout</span> Sign out
</button>
</div>

<div class="p-3">
<div class="text-xs font-label-md text-text-muted uppercase tracking-wider mb-2">Accounts</div>
<div id="accountList" class="space-y-1"></div>
</div>

<div class="p-3 mt-auto border-t border-outline-variant">
<div class="text-xs font-label-md text-text-muted uppercase tracking-wider mb-2">MCC Account</div>
<div class="text-xs text-text-muted">9060186325 — TMI MDO MCC</div>
</div>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col min-h-screen overflow-auto">
<!-- Top Bar — Channels -->
<div class="sticky top-0 z-20 bg-background/90 backdrop-blur-sm border-b border-outline-variant px-6 py-3">
<div class="flex items-center gap-4">
<div class="flex gap-2" id="channelTabs"></div>
<div class="ml-auto text-sm text-text-muted">
<span id="promptCount">0</span> prompts
</div>
</div>
</div>

<!-- Category Pills -->
<div class="bg-surface-container-low border-b border-outline-variant px-6 py-3">
<div class="flex gap-2 flex-wrap max-w-4xl" id="categoryPills"></div>
</div>

<!-- Selected Account Bar -->
<div id="accountBar" class="hidden border-b border-outline-variant px-6 py-4 bg-surface-container-low">
<div class="max-w-4xl flex items-center justify-between">
<div>
<div class="text-xs text-text-muted uppercase tracking-wider mb-1">Account</div>
<div id="accountBarName" class="text-xl font-bold text-primary"></div>
<div id="accountBarId" class="text-xs text-text-muted mt-1"></div>
</div>
<button onclick="selectAccount(null); renderAccountList();" class="text-xs text-text-muted hover:text-secondary flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size:14px">close</span> Clear
</button>
</div>
</div>

<!-- Prompt Grid -->
<div class="flex-1 p-6">
<div id="promptGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-4xl"></div>
</div>
</main>
</div>

<!-- Prompt Detail Modal -->
<div id="promptModal" class="fixed inset-0 z-50 hidden">
<div class="absolute inset-0 bg-black/60" onclick="closeModal()"></div>
<div class="absolute inset-4 md:inset-12 bg-surface-container border border-outline-variant rounded-xl flex flex-col overflow-hidden">
<div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant">
<div>
<div id="modalCategory" class="text-xs font-label-md text-secondary uppercase tracking-wider"></div>
<div id="modalName" class="font-headline-sm text-primary mt-1"></div>
</div>
<div class="flex-1 overflow-auto p-6">
<div id="modalPrompt" class="font-body-md text-on-background leading-relaxed whitespace-pre-wrap"></div>
<div id="modalNotes" class="mt-6 p-4 bg-surface-container-low rounded-lg border border-outline-variant text-sm text-text-muted"></div>
<div id="modalPreRun" class="mt-4 p-4 bg-surface-container-low rounded-lg border border-outline-variant"></div>
<!-- Date Range Picker -->
<div id="dateRangeSection" class="mt-4 p-4 bg-surface-container-low rounded-lg border border-outline-variant">
<div class="text-sm font-semibold text-primary mb-3">Date Range</div>
<div class="flex gap-2 flex-wrap" id="datePresets">
<button class="date-pill active" onclick="selectDatePreset('7')" data-days="7">Last 7 days</button>
<button class="date-pill" onclick="selectDatePreset('30')" data-days="30">Last 30 days</button>
<button class="date-pill" onclick="selectDatePreset('90')" data-days="90">Last 90 days</button>
<button class="date-pill" onclick="selectDatePreset('custom')" data-days="custom">Custom range</button>
</div>
<div id="customDateRange" class="hidden mt-3 flex gap-3 items-center">
<input type="date" id="dateFrom" class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-sm text-primary" />
<span class="text-text-muted">to</span>
<input type="date" id="dateTo" class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-sm text-primary" />
</div>
</div>
<!-- Account Context -->
<div id="modalAccount" class="mt-4 p-4 bg-surface-container-low rounded-lg border border-outline-variant hidden">
<div class="text-sm font-semibold text-secondary">Selected Account</div>
<div id="modalAccountName" class="text-lg font-bold text-primary mt-1"></div>
<div id="modalAccountId" class="text-sm text-text-muted"></div>
</div>
</div>
<!-- Modal Footer (Execute bar) -->
<div class="border-t border-outline-variant px-6 py-4 flex items-center justify-between">
<div id="executeStatus" class="text-sm text-text-muted"></div>
<div class="flex gap-2">
<button onclick="copyPrompt()" class="btn-copy flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size:16px">content_copy</span> Copy
</button>
<button onclick="executePrompt()" id="btnExecute" class="btn-execute flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size:16px">play_arrow</span> Execute
</button>
</div>
</div>
</div>
</div>

<script>
const CHANNELS = {"Google Ads": {"icon": "\ud83d\udce2", "color": "#4285F4", "prompts": [{"category": "Ad Copy", "name": "Asset & Extension Performance Review", "prompt": "Analyze the performance of all ad assets and extensions in this account during [DATE RANGE].\n\nAnalysis structure:\n1. Asset Coverage Inventory: List which asset types are present at each level (account, campaign, ad group): Sitelinks, Callouts, Structured snippets, Image assets, Call assets, Business name & logo, Promotion assets, Price assets. Flag any asset types that are completely missing or only set at account level with no campaign-level customization.\n2. Performance by Asset Type: For each asset type, summarize: Number of assets, Impressions/clicks/CTR, Performance rating (Best/Good/Low/unrated), Top and underperforming individual assets.\n3. Sitelink Deep Dive: Click distribution across sitelinks, low CTR sitelinks to replace, descriptions filled in for all?, Mobile vs desktop performance differences.\n4. Coverage Gaps & Recommendations: Which asset types should be added?, Which underperforming assets should be replaced?, Where would campaign/ad group-level assets improve relevance?, Campaigns with fewer assets than others?\n5. Ad Strength Impact: How asset coverage relates to Ad Strength ratings. Flag campaigns where adding missing asset types could lift Ad Strength.\n\nOutput rules: Lead with coverage summary. Prioritize by expected CTR or conversion impact. Max 6-8 recommendations. Format: Professional, structured with bold headers.", "notes": "Customise date range and account as needed", "prerun": ""}, {"category": "Ad Copy", "name": "Create Search Ads (RSA)", "prompt": "Create a Responsive Search Ad following Google Ads policies. Fetch the content from the website [URL].\nBefore output: Loop and verify that all headlines are max 30 characters and descriptions max 90 characters including spaces.\nAd structure:\nHeadlines (15 variations, max 30 chars each): Position 1: Keyword match headlines (4-5). Position 2: Benefit-focused headlines (4-5). Position 3: CTA and offer headlines (4-5).\nDescriptions (4-5 variations, max 90 chars each): Benefit elaboration, value propositions, trust signals and differentiators.\nPath Fields: Two URL paths, max 15 characters each.\nOutput: Complete RSA with all headline and description options as a table, and recommendations for testing variations to maximize Ad Strength.\nAfter output, ask in bold: \"Would you like a Google Ads Editor-ready format?\" If yes, output as a table with Headline 1-15, Description 1-4 as column headers with values in one row (Google Ads Editor CSV compatibility).", "notes": "Replace [URL] with target website", "prerun": ""}, {"category": "Analysis", "name": "Quality Score Performance", "prompt": "Analyze performance across all key dimensions for [DATE RANGE].\nBefore starting: Check the account's primary conversion goals to determine whether this is lead gen or ecommerce. Use CPA for lead gen, ROAS for ecommerce.\nAnalysis structure:\n1. Geographic Performance: By location. Top/bottom geos by primary KPI. Flag locations with spend and no conversions.\n2. Device Performance: By device (desktop/mobile/tablet). Compare CVR and CPA/ROAS across devices.\n3. Ad Schedule (Day & Hour): By day of week and hour. Peak conversion windows and dead zones.\n4. Demographics: By age group and gender. Top/bottom segments. Groups with high spend and no conversions.\n5. Actionable Recommendations: Max 5-7 specific actions with expected impact.\nOutput rules: Only flag meaningful differences. Include data behind each recommendation. Format: Professional with headers and bullet points.", "notes": "Replace date range as needed", "prerun": ""}, {"category": "\u26a0\ufe0f Analysis", "name": "Audience & Dimension Analysis", "prompt": "Analyze performance across all key dimensions for [DATE RANGE].\nBefore starting: Check primary conversion goals (lead gen vs ecommerce). Use CPA for lead gen, ROAS for ecommerce.\n1. Geographic Performance: By location, top/bottom geos, flag locations with spend and no conversions.\n2. Device Performance: By device, compare CVR and CPA/ROAS across devices.\n3. Ad Schedule (Day & Hour): By day/hour, peak windows and dead zones.\n4. Demographics: By age/gender, top/bottom segments.\n5. Actionable Recommendations: Max 5-7 specific actions with expected impact.\nFormat: Professional with headers and bullet points.", "notes": "Replace date range as needed", "prerun": "Check conversion goals are set up (lead gen vs ecommerce) before running. If no conversions, report will be empty."}, {"category": "\u26a0\ufe0f Analysis", "name": "Landing Page Performance", "prompt": "Analyze landing page performance across all key dimensions for [DATE RANGE].\nBefore starting: Check primary conversion goals (lead gen vs ecommerce). Use CPA for lead gen, ROAS for ecommerce.\n1. Geographic Performance: By location, top/bottom geos by primary KPI.\n2. Device Performance: By device, compare CVR and CPA/ROAS across devices.\n3. Ad Schedule (Day & Hour): By day/hour, peak windows and dead zones.\n4. Demographics: By age/gender, top/bottom segments.\n5. Actionable Recommendations: Max 5-7 specific actions with expected impact.\nFormat: Professional with headers and bullet points.", "notes": "Replace date range as needed", "prerun": "Confirm landing pages are live and accessible. If pages are down, the audit will flag errors that aren't campaign issues."}, {"category": "\u26a0\ufe0f Audits", "name": "Attribution Model Review", "prompt": "Review the attribution model setup across all conversion actions in this account.\n1. Attribution Setup: List all conversion actions with attribution model (DDA or last-click) in a table. Include account-default goals and campaign-level overrides.\n2. Consistency & Conflicts: Flag where conversion actions feeding the same bidding strategy use different models without clear strategic reason.\n3. DDA Value Assessment: Does the account have enough multi-touch paths for DDA to differ from last-click? For single-touch journeys, note similarity rather than recommending a switch.\n4. Credit Distribution & Path Analysis: How credit distributes across campaigns. Identify undervalued (high assists, low last-click) and overvalued campaigns. Note typical path length.\n5. Recommendations (max 5, ordered by impact): Model updates, budget reallocation, whether DDA is worth keeping.\nOutput rules: Distinguish data-backed findings from judgment calls. Flag limited path data clearly.\nFormat: Professional, structured with bold headers.", "notes": "", "prerun": "Verify at least 2 conversion actions exist. If only 1 action, attribution review is limited."}, {"category": "Audits", "name": "Google Recommendations & Auto-Applied Changes", "prompt": "Review Google Ads recommendations and auto-applied change settings.\n1. Recommendations Triage: Categorize each as Act on / Consider / Dismiss.\n2. Auto-Apply Audit: List all settings (enabled/disabled) and recommend enable/disable. Flag high-risk auto-applies: broad match expansion, budget increases, bid strategy changes, audience expansion, automated ad suggestions.\n3. Auto-Applied Changes Review: List auto-applied changes during the period. Note performance shifts but avoid attributing causation.\nOutput rules: Lead with count of auto-applied changes. Max 5-8 items ordered by risk.\nFormat: Professional, structured with bold headers.", "notes": "", "prerun": ""}, {"category": "\u26a0\ufe0f Audits", "name": "Conversion Tracking Health Check", "prompt": "Analyze all conversion actions and identify misconfigurations.\n1. Conversion Action Inventory: Name, category, source, primary/secondary, count setting, conversion window, attribution model, value setting.\n2. Goal Alignment: Check primary actions feeding bidding via account-default goals and campaign-level overrides. Flag: double-counting, micro-conversions feeding Smart Bidding, macro-conversions incorrectly secondary.\n3. Count Settings & Windows: Flag mismatches (lead gen on \"every\" inflating, ecommerce on \"one\" undercounting). Unusual windows.\n4. Attribution Consistency: Mixed models only where they matter for bidding.\n5. Value, Tracking & Duplicates: Dynamic value passing, enhanced conversions, offline imports, duplicate actions.\nOutput rules: Lead with health score: Healthy / Needs Attention / Critical Issues Found. Max 5-8 recommendations by severity.\nFormat: Professional, structured with bold headers.", "notes": "", "prerun": "Requires conversion tracking to be firing. Run Conversion Tracking Health Check first if tracking was recently set up."}, {"category": "\u26a0\ufe0f Audits", "name": "Deep Account Audit", "prompt": "Perform comprehensive audit for [DATE RANGE].\nAudit sequence: Setup and health first, then performance.\n1. Structure & Settings: Campaign architecture, geographic targeting, device strategy, ad scheduling, audience setup.\n2. Conversion Tracking: Primary/secondary setup, actions feeding bidding, attribution model, conversion windows, enhanced conversions.\n3. Keywords & Search Terms: Match type distribution, Quality Score issues (below 5 with significant spend), search term waste, negative keyword structure.\n4. Ads & Creative: RSA coverage, asset performance, pinning overuse, extension coverage, landing page alignment.\n5. Bidding & Budget: Bid strategy appropriateness, target CPA/ROAS realism, learning status, budget allocation.\n6. Competitive Position: Impression share trends, lost IS (budget vs rank), competitor overlap.\n7. Prioritized Recommendations (max 8-12): High / Medium / Nice to have, each with specific action and expected impact.\nFormat: Professional with headers, bullet points, and visualizations where fitting.", "notes": "", "prerun": "Minimum 30 days data recommended. Check primary conversion goals (lead gen vs ecommerce) before starting."}, {"category": "\u26a0\ufe0f Audits", "name": "Ecommerce Website Audit", "prompt": "Audit the ecommerce store [URL] for ability to convert paid traffic and reduce wasted ad spend.\n1. Load audit method: Call load_skill('ecommerce_website_audit') and follow it exactly.\n2. Gather ad context: Find ad groups pointing to store, pull keywords and ad copy, read target market/language/currency.\n3. Run the audit of [URL] with keywords + ad copy as ad context.\n4. Deliver as self-contained HTML: Sticky nav, header, critical alerts, funnel overview (Home > Category > PDP > Cart > Checkout), per-page scorecards, offers/upsells/AOV, paid-traffic strategy, consolidated quick wins (P1/P2/P3), methodology note.\nClean, professional layout.", "notes": "Replace [URL] with target store", "prerun": "Site must be live and have products/services. Check URL loads before running. For Shopify/WooCommerce, confirm checkout flow works."}, {"category": "\u26a0\ufe0f Audits", "name": "Fast Account Health Check", "prompt": "Fast health check across all campaigns for [DATE RANGE].\nBefore starting: Check primary conversion goals (lead gen vs ecommerce).\nCheck for:\n1. Performance anomalies vs recent history.\n2. Budget & pacing issues.\n3. Impression share losses (budget vs rank).\n4. Obvious waste: keywords/search terms/placements with spend and no/poor conversions.\n5. Tracking red flags: conversions suddenly at zero, large click-to-session gaps.\nOutput rules: Flag only items needing attention. If healthy, say so. Order by urgency. Concise.\nFormat: Professional with bullet points.", "notes": "", "prerun": "Requires conversion tracking to be active. If tracking was just installed, wait 7 days for data to accumulate."}, {"category": "Audits", "name": "Landing Page Audit (Campaign-Linked)", "prompt": "Audit landing page [URL] to improve Landing Page Experience / Quality Score and reduce CPC.\n1. Gather ad context: Find ad groups pointing to URL, pull keywords and ad copy, read target market/language. Confirm findings.\n2. Run landing page audit with keywords + ad copy as ad context.\n3. Deliver with prioritized recommendations to lift Landing Page Experience score.", "notes": "Replace [URL] and campaign name", "prerun": ""}, {"category": "\u26a0\ufe0f Audits", "name": "Standard Account Audit", "prompt": "Standard audit for [DATE RANGE].\nBefore starting: Check primary goals (lead gen vs ecommerce).\nLead gen: Prioritize CPA, CVR, lead quality, call vs form, Impression Share.\nEcommerce: Prioritize ROAS, product-level performance.\n1. Structure & Settings: Campaign organization, targeting, ad scheduling, budget allocation.\n2. Conversion Tracking: Setup completeness, duplicates, attribution model, actions feeding bidding.\n3. Keywords & Search Terms: Match types, search term waste, negatives, Quality Score issues.\n4. Ads & Extensions: Copy quality, RSA assets, extension usage. PMax: asset group completeness.\n5. Performance & Efficiency: Top/bottom performers by primary KPI, CTR, CVR, CPA/ROAS. Wasted spend.\n6. Prioritized Quick Wins (5-8 items): High / Medium / Nice to have with specific action and expected impact.\nFormat: Professional with headers and bullet points.", "notes": "", "prerun": "Check primary goals (lead gen vs ecommerce) before starting. This determines whether to prioritise CPA or ROAS."}, {"category": "Keywords", "name": "Search Term Snapshot", "prompt": "Show me what people are searching for in [DATE RANGE].\n1. Top Performers: Search terms driving most conversions.\n2. High Spenders: Terms with significant spend (show conversion status).\n3. Potential Negatives: Irrelevant or low-intent terms worth blocking.\n4. Opportunities: Good terms not yet added as keywords.\nPresent as tables. Highlight waste or wins.\nFormat: Professional with tables.", "notes": "Replace date range", "prerun": ""}, {"category": "Keywords", "name": "Keyword Planner from URL", "prompt": "Use the Keyword Planner for URL: [URL]\nBefore output: Check existing negative keywords at account and campaign level.\nOutput rules:\n1. Group keywords by intent (3-4 tables max): Keyword | Avg. Monthly Volume | Competition | Avg. CPC. Sort by volume desc.\n2. Negative Keyword Suggestions: Negative Keyword | Match Type | Reason. Cross-reference with existing negatives, only suggest new ones.\n3. Key Notes: Only if something stands out. Max few bullets.\nNo additional commentary beyond headlines and notes.", "notes": "Replace [URL] with target page", "prerun": ""}, {"category": "\u26a0\ufe0f Optimise", "name": "Competition Landscape", "prompt": "Analyze competitive auction landscape for [CAMPAIGN] during [DATE RANGE] using auction insights.\n1. Competitor Overview: Top competitors by overlap rate. Each: impression share, overlap rate, position above rate, outranking share, top-of-page rate, absolute top-of-page rate.\n2. Your Position: Impression share vs top 3 competitors. Consistently outranked or mixed? Improving or declining?\n3. Threat Assessment: Dominant (high IS + high position above), Emerging (lower IS but growing), Weak (high overlap, low position above).\n4. Impression Share Gaps: Lost to rank (fixable via bids/QS/ad relevance), Lost to budget (fixable via increases/reallocation).\n5. Recommendations: Where to increase bids/budgets, improve Quality Score, accept lower position. Max 5-7 by potential IS gain.\nFormat: Professional with competitor comparison table.", "notes": "Replace campaign and date range", "prerun": "Auction Insights access required. If restricted, the competitor data will be incomplete."}, {"category": "\u26a0\ufe0f Optimise", "name": "Wasted Spend & Efficiency", "prompt": "Identify and quantify wasted spend for [DATE RANGE].\n1. Search Term Waste: Terms with spend >= $[THRESHOLD] and zero conversions, irrelevant patterns, info-seeking terms.\n2. Keyword Performance: Keywords with spend above $[THRESHOLD] and ROAS/CPA below average, declining CTR, broad match triggering poor queries.\n3. Negative Keyword Gaps: Missing negatives at campaign, ad group, and shared list levels.\n4. Geographic & Device Waste: Locations/devices with high spend and poor conversion rates.\n5. Schedule Inefficiency: Time blocks where spend is high and conversions low.\n6. Quantified Impact: Total wasted spend, projected monthly savings, ROAS/CPA improvement potential.\nOutput rules: Focus on waste identification, not general advice. Verify percentages are valid. Max 6 sections.\nFormat: Professional with headers and bullet points.", "notes": "Replace date range and spend threshold", "prerun": "Set a spend threshold ($50, $100, $200) before running \u2014 the prompt uses this to flag waste."}, {"category": "\u26a0\ufe0f Optimise", "name": "Budget Reallocation & Bidding Strategy", "prompt": "Analyze budget distribution and bidding strategies for [DATE RANGE].\nBefore starting: Check primary goals (lead gen vs ecommerce).\n1. Current Budget Overview: Spend distribution, top consumers, campaigns \"limited by budget\" and consistently underspending.\n2. Bidding Strategy Assessment: Each campaign's strategy, appropriateness, learning status, unrealistic targets.\n3. Reallocation Opportunities: \"Move [amount/%] from [A] to [B] because [reason], expected impact: [outcome].\"\n4. Bidding Recommendations: Strategy changes with rationale and transition approach.\nOutput rules: Prioritize by impact. Be specific with numbers ($X/day or X%). Max 5-7 recommendations.\nFormat: Professional with headers and bullet points.", "notes": "Replace date range", "prerun": "Check bid strategies are correctly set before analysing. If strategies were recently changed, wait 2 weeks for learning phase."}, {"category": "\u26a0\ufe0f PMax", "name": "Audience Signal Performance", "prompt": "Analyze audience signal performance for [CAMPAIGN] during [DATE RANGE].\n1. Audience Signal Overview: List all signals - custom segments, remarketing/customer match, interests & demographics, custom intent. Performance data: impressions, clicks, conversions, CPA/ROAS.\n2. Signal Effectiveness: High-performing (good conversion rates), High-reach/low-conversion (impressions but not converting), Underused (minimal delivery).\n3. Audience Expansion: Delivery beyond configured signals. Signal-guided vs expanded traffic performance.\n4. Asset Group x Audience Comparison: Which audiences respond best to which asset group. Flag mismatches.\n5. Recommendations: Max 5 actions - signals to add/refine/remove, asset group adjustments, tighten vs loosen signals.\nOutput rules: State what's reported vs inferred. Focus on actionable insights.\nFormat: Professional with clear headers.", "notes": "Replace campaign and date range", "prerun": "Check if audience signals are configured \u2014 if 0 signals, that's the primary finding. Also verify asset groups exist."}, {"category": "\u26a0\ufe0f PMax", "name": "Performance Breakdown", "prompt": "Diagnose health of [CAMPAIGN] over [DATE RANGE].\n1. Overall Performance: Key metrics, trend direction, learning phase status.\n2. Channel Breakdown: By Search, Shopping, YouTube, Display, Gmail, Discover, Maps. Spend, conversions, CPA/ROAS per channel. Flag channels significantly worse than campaign average.\n3. Asset Group Health: Performance by asset group, low ad strength, missing asset types, asset fatigue signs.\n4. Spend & Delivery: Full budget spent? Underspending causes vs overspending inefficiencies.\n5. Search Cannibalisation: PMax search term overlap with active Search campaigns. Queries where PMax wins at worse CPA/ROAS.\n6. Recommendations: Max 5 actions prioritized by impact.\nOutput rules: Be specific about what data shows vs doesn't. PMax has limited transparency.\nFormat: Professional with headers and bullet points.", "notes": "Replace campaign and date range", "prerun": "Verify PMax campaign is active and has asset groups. If campaign is paused or has no assets, report will be limited."}, {"category": "PMax", "name": "Search Term Insights", "prompt": "Pull search term insights for [CAMPAIGN] during [DATE RANGE].\nExecution:\n1. Identify PMax campaigns with IDs and performance.\n2. Query campaign_search_term_insight: id, campaign_id, category_label, impressions, clicks, conversions, conversions_value, ctr. Order by impressions DESC. Limit 300.\n3. Calculate baseline conversion rate from full dataset.\n4. Top 10 search terms by impressions: search term, impressions, clicks, CTR%, conversions, revenue, AOV.\n5. Statistical analysis: Compare each term to baseline CVR. Flag if sample < 50 clicks. Expected conversions = clicks x baseline CVR.\n6. Categorization: Group by intent types, competitor mentions, converting vs non-converting.\nOutput: Lead with top 10 table. Statistical context. State data limitations.\nFormat: Concise with tables.", "notes": "Replace campaign and date range", "prerun": ""}, {"category": "\u26a0\ufe0f PMax", "name": "Placement Exclusion Report", "prompt": "Placement exclusion report for [CAMPAIGN] during [DATE RANGE].\nFilter: Only placements with >1,000 impressions.\n1. Placements to Exclude (High Priority): Above threshold, zero conversions (or extremely poor CPA/ROAS). Show: placement name/URL, impressions, clicks, CTR, cost, conversions. Sort by cost desc.\n2. Placements to Review: Above threshold with conversions but 2x+ worse CPA/ROAS than average.\n3. Top Performing Placements: 5-10 best for context.\n4. Exclusion Summary: % of spend going to flagged placements. Estimated savings.\n5. How to Exclude: Brief PMax exclusion list reminder.\nFormat: Action-oriented table format, ready to act on.", "notes": "Replace campaign and date range", "prerun": "Requires PMax placement data. If campaign is new (<2 weeks), placement data may be insufficient."}, {"category": "Reporting", "name": "Monthly Client Report", "prompt": "Client-facing monthly performance report for [MONTH YEAR]. Compare against previous period of equal length.\nTone: Lead with wins. Frame challenges constructively. No tracking accuracy claims without evidence. 400-600 words, insights over raw data.\n1. Executive Summary (3-5 sentences): Overall spend, conversions, primary KPI with period-over-period change. One win, one focus area.\n2. Highlights & Wins: Top 3-5 achievements with key numbers.\n3. Opportunities & Challenges: 2-3 underperforming areas, constructive opportunities.\n4. Priorities for Next Month: High / Medium / Nice to have, max 3-5 actions.\nFormat: Professional, easy to scan. Bold key metrics, short bullets.", "notes": "Replace month/year", "prerun": ""}, {"category": "Reporting", "name": "Email Summary for Client", "prompt": "Email summary for stakeholders covering [DATE RANGE]. Compare against previous period of equal length.\nTone: Lead with wins. Frame challenges constructively. No tracking claims without evidence.\n1. Opening Summary (2-3 sentences): Performance status and trend.\n2. Core Metrics Table: Spend, Conversions, CPA/ROAS, CTR with period comparison and trend indicators.\n3. Key Highlights: Top win (with numbers), area of focus with action.\n4. One Priority Recommendation: Single next step with expected impact.\nOutput: Email-ready (max 300 words), subject line suggestion, scannable table, 2-4 minute read.", "notes": "Replace date range", "prerun": ""}, {"category": "Reporting", "name": "Compare Two Date Ranges", "prompt": "Email summary comparing [DATE RANGE 1] vs [DATE RANGE 2]. Compare against previous period of equal length.\nTone: Lead with wins. Frame challenges constructively. No tracking claims without evidence.\n1. Opening Summary (2-3 sentences): Performance status and trend.\n2. Core Metrics Table: Spend, Conversions, CPA/ROAS, CTR with comparison and trend indicators.\n3. Key Highlights: Top win (with numbers), area of focus with action.\n4. One Priority Recommendation: Single next step with expected impact.\nOutput: Email-ready (max 300 words), subject line suggestion, scannable table, 2-4 minute read.", "notes": "Replace date ranges", "prerun": ""}, {"category": "\u26a0\ufe0f Tracking", "name": "GTM & Google Ads Tracking QA", "prompt": "Act as an expert Google Tag Manager (GTM) and Google Ads Tracking Specialist. Audit, troubleshoot, and verify the tracking integration for a digital marketing client.\n\nContext required:\n- Website Platform: [e.g., WordPress, Shopify, Custom HTML]\n- Key Google Ads Conversion Actions: [e.g., Lead Form Submission, Purchase, Click to Call]\n- Current Status or Issue: [e.g., brand new setup needing full QA / Conversions showing unverified / suspected duplicate counting]\n\nProvide a comprehensive, step-by-step QA framework:\n1. What to look for in GTM Preview Mode (Tag Assistant)\n2. What to check inside Google Ads UI (Status, Tag Diagnostics)\n3. Critical settings often missed (Conversion Linker, Enhanced Conversions, Data Layer variables)\n\nStructure with clear headings. Ask clarifying questions for triggers/variables.", "notes": "Replace placeholders with client specifics", "prerun": "Run GTM Installation Verification FIRST. Have GTM container access ready (preview mode or container export). If no GTM access, prompt can only do UI-level checks."}, {"category": "\u26a0\ufe0f Tracking", "name": "GTM Container & Data Layer Troubleshoot", "prompt": "Act as a Senior Google Tag Manager (GTM) Engineer and Data Layer Auditor. I need you to perform a deep-dive audit of the GTM container, tag configuration, trigger logic, and data layer implementation for a digital marketing client.\n\nContext:\n- Website URL: [e.g., https://www.example.com]\n- GTM Container ID: [e.g., GTM-XXXXXXX]\n- Website Platform: [WordPress, Shopify, Custom HTML, etc.]\n- Known Issues: [e.g., tags not firing, duplicate events, missing purchase data, GA4 not receiving events]\n- GTM Access: [Yes/No \u2014 can I share the container export or preview mode screenshots?]\n\nPerform the following audit:\n\n1. CONTAINER STRUCTURE REVIEW\n   - List all tags, triggers, and variables in the container\n   - Identify unused/orphaned tags and triggers\n   - Check for naming conventions and organisational issues\n   - Flag any deprecated or legacy tags (e.g., old UA tags still present)\n\n2. TAG AUDIT\n   - For each active tag: what it fires, when it fires, what it sends\n   - Check Google Ads tags: conversion ID, conversion label, value passing, currency, transaction ID\n   - Check GA4 tags: measurement ID, event name, parameter mapping\n   - Check Conversion Linker tag: is it present, firing on all pages, using auto-collection?\n   - Check for tag sequencing: are setup tags (e.g., Conversion Linker) firing before conversion tags?\n   - Flag any tags firing on DOM Ready vs Window Load that should be firing earlier/later\n\n3. TRIGGER AUDIT\n   - Map each trigger to the tag(s) it fires\n   - Check for trigger conflicts (multiple triggers with different firing conditions on the same tag)\n   - Verify page view triggers: All Pages vs specific pages \u2014 are they correct?\n   - Check click triggers: are they using Click URL, Click ID, Click Classes correctly?\n   - Verify form submit triggers: are they using Form ID, Form Target, or Validation?\n   - Check for custom event triggers: are the event names matching the data layer pushes exactly?\n   - Flag any triggers with overly broad conditions that could cause unintended firings\n\n4. DATA LAYER AUDIT\n   - List all dataLayer.push() events found on the site\n   - Map each push to the GTM variable that consumes it\n   - Check for: missing required parameters, inconsistent naming, incorrect data types\n   - Verify ecommerce data layer (GA4 format): items array structure, value, currency, transaction_id\n   - Check for data layer pollution: non-standard objects, duplicate pushes, stale data\n   - Verify data layer version (dataLayer = [] vs gtag = [] vs gtm.js) \u2014 are they compatible?\n   - Test for timing issues: is the data layer populated BEFORE GTM reads it?\n\n5. VARIABLE AUDIT\n   - List all Data Layer Variables and what they reference\n   - Check for variable naming consistency\n   - Flag any variables referencing data layer keys that may not exist\n   - Check for URL variables: are they extracting the right parameters?\n   - Verify custom JavaScript variables for potential errors\n\n6. COMMON PITFALLS CHECKLIST\n   - [ ] Conversion Linker tag present and firing on all pages\n   - [ ] No duplicate conversion tags (same conversion label firing multiple times)\n   - [ ] Enhanced Conversions: user-provided data correctly captured in data layer\n   - [ ] Consent mode: if GDPR/privacy compliance needed, is consent state being respected?\n   - [ ] Cross-domain tracking: if multiple domains, is linker configured?\n   - [ ] iframe/embed tracking: are iframes being tracked or causing gaps?\n   - [ ] Tag Manager container loaded in <head>, not <body>\n   - [ ] No data race between data layer pushes and GTM container load\n\n7. RECOMMENDATIONS\n   - Prioritised list of fixes (Critical / High / Medium / Low)\n   - For each issue: what the problem is, why it matters, and the exact fix\n   - Suggested testing steps after each fix\n\nAsk me clarifying questions about the GTM setup if you need more detail. If I can share a container export or Tag Assistant screenshot, let me know what to look for.", "notes": "GTM-specific. Request container export or Tag Assistant screenshots for deeper analysis.", "prerun": "Run GTM Installation Verification FIRST. Requires GTM container export or Tag Assistant screenshots. Prompt cannot access GTM directly."}, {"category": "Merchant Center", "name": "Merchant Center Feed Audit", "prompt": "Audit the Google Merchant Center account for feed integration health, product approval status, and Shopping campaign readiness.\n\nBefore starting: Confirm the Merchant Center account ID and whether it is linked to the active Google Ads MCC.\n\n1. Account Access & Linkage\n   - Verify the Merchant Center account is accessible via the Content API for Shopping.\n   - Check if the Merchant Center account is linked to a Google Ads account (Settings > Linked Accounts).\n   - If no Ads account is linked, flag as a blocker for Shopping campaigns.\n\n2. Feed Status\n   - List all product feeds in the account.\n   - For each feed: name, status (active/paused/error), content type, last upload date, processing status.\n   - Flag any feeds with errors, warnings, or stalled processing.\n\n3. Product Approval Status\n   - Pull product status breakdown: approved, disapproved, pending, limited.\n   - For disapproved products: list top 10 with disapproval reason codes and descriptions.\n   - For limited products: list top 10 with limiting reasons.\n   - Summarise total product count and approval rate.\n\n4. Feed Attribute Completeness\n   - Check required attributes are present: id, title, description, link, image_link, price, availability.\n   - Check recommended attributes: brand, gtin, mpn, condition, google_product_category, product_type.\n   - Flag products missing required attributes or critical recommended ones (especially GTIN and brand).\n\n5. Policy Violation Check\n   - Identify any account-level or product-level policy violations.\n   - Categorise by type: misrepresentation, missing GTIN, image issues, price mismatch, availability mismatch, prohibited content.\n   - For each violation, provide the specific product(s) affected and the resolution steps.\n\n6. Shopping Campaign Readiness\n   - Combined readiness checklist:\n     a. Merchant Center account accessible\n     b. At least one feed active\n     c. Feed processing completed successfully\n     d. Products approved (not all disapproved)\n     e. Google Ads account linked to Merchant Center\n   - List any action items required before Shopping campaigns can run.\n\n7. Recommendations\n   - Prioritised fixes for disapproved products.\n   - Feed optimisation suggestions (missing attributes, better titles/descriptions).\n   - Linkage or setup issues to resolve.\n   - Max 8 recommendations ordered by impact.\n\nOutput rules: Lead with the readiness checklist. Quantify issues (X of Y products disapproved, Z attribute gaps). Be specific about which products are affected and why. If everything is healthy, say so clearly.\nFormat: Professional with bold headers, status indicators (green check / red cross / amber warning), and tables for product status breakdown.", "notes": "Requires Content API for Shopping enabled. Uses same OAuth credentials as Google Ads API.", "prerun": ""}, {"category": "\u26a0\ufe0f Feed Management", "name": "Shopping Campaign Feed Management", "prompt": "Audit and optimise the product feed specifically for Shopping campaign performance. Focus on how feed quality impacts Smart Bidding and AI-driven product targeting.\n\nContext required:\n- Merchant Center account ID\n- Shopping campaign name(s) to analyse\n- Date range for performance data\n\n1. Feed-to-Campaign Mapping\n   - Identify which products from the feed are serving in which Shopping campaigns.\n   - Check for product overlap between Standard Shopping and Performance Max (cannibalisation risk).\n   - Flag products in the feed that are not appearing in any campaign (orphaned products).\n   - Verify campaign priority settings (low/medium/high) are correctly routing products.\n\n2. Feed Segmentation & Product Groups\n   - Map feed attributes (brand, category, product type, custom labels) to product group structure.\n   - Identify campaigns with no segmentation (all products in one group).\n   - Recommend segmentation opportunities based on feed attribute richness.\n   - Flag product groups with too many products (>500) limiting bid granularity.\n\n3. Smart Bidding + Feed Quality Correlation\n   - For top-performing campaigns: which feed attributes correlate with high ROAS/low CPA?\n   - For underperforming campaigns: are feed quality issues limiting Smart Bidding?\n   - Check if products with complete attributes (GTIN, brand, condition) outperform those without.\n   - Flag campaigns where Smart Bidding has insufficient conversion data linked to feed products.\n\n4. Supplemental Feed Strategy\n   - Are supplemental feeds being used to enrich primary feed data?\n   - Identify gaps that supplemental feeds could fill (missing custom labels, additional descriptions, sale prices).\n   - Check supplemental feed sync frequency and last update timing.\n   - Recommend supplemental feed rules for automating attribute enrichment.\n\n5. Feed Freshness & Sync\n   - Last feed fetch time vs recommended cadence (daily for ecommerce).\n   - Products with stale pricing or availability (price on landing page differs from feed).\n   - Feed processing errors or warnings in the last 7 days.\n   - Impact of feed staleness on impression share or product visibility.\n\n6. Feed Attribute Optimisation for Shopping AI\n   - Title optimisation: are titles keyword-rich and within 150 chars?\n   - Description quality: are descriptions informative or generic?\n   - Image quality: main image URLs returning valid images, no promotional overlays.\n   - Price competitiveness: are feed prices consistent with landing page and competitive?\n   - Custom labels: are they being used strategically for bid/budget control?\n\n7. Recommendations\n   - Specific feed attribute fixes with expected campaign impact.\n   - Segmentation changes based on feed data quality.\n   - Supplemental feed setup or improvements.\n   - Sync schedule adjustments.\n   - Max 8 recommendations ordered by expected ROAS/CPA impact.\n   Format: Professional with tables for feed attribute coverage, status indicators for feed health, and clear action items.", "notes": "Ensure Merchant Center feed audit is complete first (google-merchant-center skill). Requires Shopping campaign data access.", "prerun": "Run Merchant Center Feed Audit first to confirm feed is active. If feed has errors, fix those before optimising."}, {"category": "\u26a0\ufe0f Feed Management", "name": "Performance Max Feed Management", "prompt": "Audit and optimise product feeds and asset feeds specifically for Performance Max campaign AI performance. PMax AI mixes products + creative across Search, Shopping, YouTube, Display, Gmail, Discover, and Maps \u2014 feed quality directly determines where and how ads serve.\n\nContext required:\n- Merchant Center account ID\n- PMax campaign name(s) to analyse\n- Date range for performance data\n\n1. Product Feed x PMax\n   - List all products available to PMax from the Merchant Center feed.\n   - Identify which products are actually serving (via PMax search terms, shopping placements).\n   - Flag products with high cost and low conversions \u2014 are they feed quality issues or targeting issues?\n   - Check for product exclusions: are any products deliberately excluded? Should more be?\n   - Verify product group structure matches campaign goals (brand filtering, category focus).\n\n2. Asset Feed x Product Feed Alignment\n   - Map asset groups to the products they serve alongside.\n   - Flag asset groups where product range doesn't match the creative messaging.\n   - Check if asset group themes align with product categories (e.g., \"Running Shoes\" asset group serving handbag products).\n   - Identify asset groups with too many or too few products for effective AI matching.\n\n3. PMax AI Signal Quality\n   - How well does the feed provide signals for AI targeting?\n   - Attribute completeness: GTIN, brand, product type, custom labels \u2014 completeness score per asset group.\n   - Feed descriptions: are they providing enough context for AI to match to search queries?\n   - Custom labels used for audience signal guidance? Are they meaningful or generic?\n\n4. Feed Freshness for PMax\n   - PMax AI re-evaluates product performance continuously \u2014 stale feeds hurt.\n   - Last feed update timing vs PMax performance changes.\n   - Price/availability sync: are feed prices matching landing pages in real-time?\n   - Seasonal/trending products: are new products added quickly enough for trend capture?\n   - Feed processing latency: how long between feed upload and products serving in PMax?\n\n5. Cross-Channel Feed Performance\n   - PMax serves across multiple surfaces \u2014 how does feed quality vary by channel?\n   - Shopping placements: product title/image quality driving CTR?\n   - YouTube placements: are product images suitable for video ad formats?\n   - Display/Gmail: are products visually appealing for native ad formats?\n   - Search: are product titles matching search query intent?\n   - Flag channels where feed quality is limiting delivery.\n\n6. Feed Exclusion & Prioritisation Strategy\n   - Are products with low margins or poor stock being excluded?\n   - Is there a suppression strategy for products that shouldn't appear in PMax?\n   - Check if custom labels are being used to prioritise high-value products.\n   - Verify brand exclusions are working (competitor brand protection).\n\n7. Recommendations\n   - Feed attribute fixes mapped to specific PMax channels where they'll have impact.\n   - Asset group restructuring based on feed product alignment.\n   - Custom label strategy for bid/priority control.\n   - Feed freshness improvements.\n   - Exclusion/prioritisation changes.\n   - Max 8 recommendations ordered by expected impact on PMax ROAS/CPA.\n   Format: Professional with channel-by-channel feed quality assessment, asset group mapping table, and prioritised action items.", "notes": "PMax has limited transparency \u2014 focus on what the feed data shows. Cross-reference with PMax channel performance report. Requires both Shopping and Demand campaign data access.", "prerun": "Check PMax has asset groups configured. If no asset groups, there's nothing to map products to."}, {"category": "\u26a0\ufe0f Feed Management", "name": "Demand Gen Feed Management", "prompt": "Audit and optimise product feeds specifically for Demand Gen campaign performance. Demand Gen serves carousel, image, and video ads across YouTube, Discover, and Gmail \u2014 feed quality drives visual ad creative and audience targeting.\n\nContext required:\n- Merchant Center account ID\n- Demand Gen campaign name(s) to analyse\n- Date range for performance data\n\n1. Product Feed x Demand Gen\n   - List products available to Demand Gen from the Merchant Center feed.\n   - Identify which products are serving in carousel and shopping-style ads.\n   - Check product image quality: are images square (1:1), high-resolution, clean backgrounds?\n   - Flag products with low CTR \u2014 is it a feed image/title issue or an audience issue?\n   - Verify product feed is enabled for Demand Gen (separate from Shopping/PMax in Merchant Center).\n\n2. Carousel Ad Feed Quality\n   - For carousel campaigns: how many products per carousel? Is the range cohesive?\n   - Product sequencing in carousels: are related products grouped logically?\n   - Title length: are titles truncated in carousel cards (max ~40 chars visible)?\n   - Image consistency: do carousel product images look uniform and professional?\n   - Flag carousels mixing unrelated product categories.\n\n3. Audience x Feed Alignment\n   - Demand Gen targets based on audience signals \u2014 how does feed support this?\n   - Are product attributes (category, brand, price) aligned with audience segments?\n   - Check if custom audiences align with product feed categories.\n   - Flag audience/product mismatches (luxury audience targeting budget products, etc.).\n   - Are similar audiences finding relevant products in the feed?\n\n4. Feed Attribute Completeness for Visual Surfaces\n   - Demand Gen is visual \u2014 which feed attributes matter most?\n   - Image link quality: resolution, aspect ratio, file format, loading speed.\n   - Additional image links: are supplementary images available for richer ad formats?\n   - Price and sale price: are they displayed correctly in ad cards?\n   - Brand: is brand visible in the ad unit?\n   - Availability: are out-of-stock products being excluded automatically?\n\n5. Feed Freshness & Visual Timeliness\n   - Demand Gen targets users in discovery mode \u2014 freshness matters for trends.\n   - How quickly do new products appear in Demand Gen ads after feed update?\n   - Are seasonal products being added/removed in sync with demand?\n   - Price update lag: do sale prices show in ads promptly?\n   - Product availability sync: are discontinued items still showing?\n\n6. Cross-Campaign Feed Conflict\n   - Products in Demand Gen AND Shopping AND PMax \u2014 cannibalisation risk?\n   - Are the same products appearing in multiple campaign types with different bid strategies?\n   - Check impression share overlap between Demand Gen and other feed-driven campaigns.\n   - Recommend feed exclusion or prioritisation to reduce internal competition.\n\n7. Creative Asset Mapping\n   - How well does the feed feed into Demand Gen creative assets?\n   - Are product feed images being used as ad creatives, or are separate assets uploaded?\n   - For video campaigns: are product feed images suitable for video ad formats?\n   - Check if feed-based ads outperform or underperform custom creative ads.\n   - Recommend when to use feed-driven creative vs custom assets.\n\n8. Recommendations\n   - Feed attribute fixes specific to visual ad surfaces (image quality, title length).\n   - Audience-feed alignment improvements.\n   - Creative asset strategy (feed-driven vs custom).\n   - Exclusion/prioritisation to reduce cross-campaign cannibalisation.\n   - Freshness improvements for trend capture.\n   - Max 8 recommendations ordered by expected CTR/conversion impact.\n   Format: Professional with visual quality assessment, carousel-specific feedback, and clear action items.", "notes": "Demand Gen replaced Discovery campaigns. Focus on visual ad surfaces \u2014 feed images directly impact CTR. Cross-reference with asset performance data.", "prerun": "Verify Demand Gen campaign is active and has product feed enabled in Merchant Center."}, {"category": "\u26a0\ufe0f Feed Management", "name": "Local Campaign Feed Management", "prompt": "Audit and optimise the business data feed specifically for Local campaign performance. Local campaigns use AI to serve ads across Google Maps, Search, Display, and YouTube \u2014 feed quality drives location accuracy, store visibility, and local ad relevance.\n\nContext required:\n- Merchant Center or Google Business Profile account\n- Local campaign name(s) to analyse\n- Date range for performance data\n- Number of store locations\n\n1. Business Data Feed x Local Campaigns\n   - List all store locations in the business data feed.\n   - Verify each location is claimed and verified in Google Business Profile.\n   - Check location count matches the Local campaign targeting settings.\n   - Flag locations in the feed that are not targeted by any campaign.\n   - Verify location extensions are linked and syncing to Google Ads.\n\n2. NAP Consistency (Name, Address, Phone)\n   - Compare feed data against Google Business Profile listings.\n   - Flag mismatches in business name, street address, city, postal code, phone number.\n   - Check for duplicate listings (same address, slightly different names).\n   - Verify phone numbers are active and routing correctly.\n   - NAP inconsistencies confuse AI and reduce local ad relevance.\n\n3. Store Hours & Availability\n   - Are store hours in the feed accurate and up to date?\n   - Are holiday hours or special hours reflected in the feed?\n   - Flag locations where feed hours differ from Google Business Profile hours.\n   - Check if store hours impact ad scheduling (ads showing when store is closed).\n   - For local inventory ads: is in-store availability synced from the feed?\n\n4. Location Attributes for AI Targeting\n   - Which feed attributes are available for AI local targeting?\n   - Business category: is it specific (e.g., \"Italian Restaurant\") or generic (e.g., \"Restaurant\")?\n   - Store photos: are they high-quality, current, and representative?\n   - Store description: is it informative or placeholder text?\n   - Attributes that help AI match user intent to the right location.\n\n5. Local Inventory Ads Feed (if applicable)\n   - Is the local inventory feed active and syncing?\n   - Product availability per store: is it accurate?\n   - Price consistency between local inventory feed and store pricing.\n   - Check for stores with zero products in the inventory feed.\n   - Local inventory ads require both a product feed AND a local inventory feed \u2014 verify both are connected.\n\n6. Geo-Targeting & Radius Alignment\n   - Are location targets in the campaign aligned with store service areas?\n   - Flag stores with overly tight radius (missing nearby customers) or overly wide radius (wasting budget on distant users).\n   - Check if multiple stores have overlapping target areas (internal competition).\n   - Verify city/state targeting matches actual store locations in the feed.\n\n7. Feed Freshness & Sync\n   - When was the business data feed last updated?\n   - How frequently does Google Ads pull from the feed?\n   - Are changes to store hours, phone numbers, or addresses propagating to ads?\n   - For local inventory: how quickly does stock availability update?\n   - Stale local feeds cause ads to show wrong info \u2014 flag sync delays.\n\n8. AI Performance Signals\n   - How does feed quality impact Local campaign AI performance?\n   - Locations with complete, accurate feeds vs those with gaps \u2014 performance comparison.\n   - Check if locations with photos and descriptions have higher CTR.\n   - Are store ratings and reviews (from GBP) feeding into ad extensions?\n   - AI uses proximity, relevance, and prominence \u2014 feed quality affects relevance and prominence.\n\n9. Recommendations\n   - NAP cleanup actions (specific locations, specific fields to fix).\n   - Feed attribute enrichment (photos, descriptions, categories).\n   - Local inventory feed setup or fixes.\n   - Geo-targeting adjustments based on store locations.\n   - Sync schedule improvements.\n   - Max 8 recommendations ordered by expected local engagement impact.\n   Format: Professional with location-by-location status table, NAP consistency report, and prioritised action items.", "notes": "Requires Google Business Profile access for full NAP audit. Local inventory ads need both Merchant Center product feed AND local inventory feed.", "prerun": "Requires Google Business Profile access for full NAP audit. Have GBP login ready."}, {"category": "\u26a0\ufe0f Feed Management", "name": "Hotel Campaign Feed Management", "prompt": "Audit and optimise the hotel feed specifically for Hotel campaign performance. Hotel campaigns use Google Hotel Ads with AI-driven bidding \u2014 feed quality directly determines rate visibility, room type matching, and booking conversions.\n\nContext required:\n- Hotel Center account ID or Google Hotels Partner ID\n- Hotel campaign name(s) to analyse\n- Date range for performance data\n- Number of properties in the feed\n\n1. Hotel Center Feed x Campaign Mapping\n   - List all properties in the hotel feed.\n   - Verify each property is active and approved in Hotel Center.\n   - Check property count matches the campaign targeting settings.\n   - Flag properties in the feed that are not appearing in Hotel Ads.\n   - Verify the Hotel Center account is linked to the correct Google Ads account.\n\n2. Property Feed Completeness\n   - For each property, check feed attributes:\n     - Property name (accurate, matches brand guidelines)\n     - Star rating (correct classification)\n     - Address and geographic coordinates (lat/long accuracy)\n     - Phone number and website URL\n     - Amenity descriptions (pool, wifi, parking, etc.)\n     - Property images (quality, resolution, representative)\n   - Flag properties with missing or placeholder data.\n   - Completeness score per property \u2014 low scores hurt AI ad relevance.\n\n3. Room Type & Rate Feed\n   - List all room types per property in the feed.\n   - Verify room type names are descriptive and standardised (not codes or abbreviations).\n   - Check rate plans: are they correctly mapped to room types?\n   - Flag room types with no rates or stale pricing.\n   - Are occupancy settings correct (1 adult, 2 adults, family)?\n\n4. Rate Parity & Pricing Accuracy\n   - Compare feed rates against the property's direct booking website.\n   - Flag rate discrepancies (feed shows different price than website).\n   - Check for rate parity violations (OTAs showing lower rates than direct).\n   - Verify currency codes are correct per property region.\n   - Are taxes and fees included or excluded consistently?\n   - Rate parity issues reduce Hotel Ads visibility and AI bid effectiveness.\n\n5. Availability Sync\n   - Is room availability syncing in real-time from the property management system (PMS)?\n   - Flag properties where availability shows zero rooms (feed disconnected or PMS sync broken).\n   - Check availability lag: how long between a room being booked and the feed updating?\n   - Are sold-out rooms being removed from the feed promptly?\n   - Stale availability wastes AI bids on unavailable rooms.\n\n6. Connectivity Provider & Feed Method\n   - How is the hotel feed connected? (Direct API, connectivity partner, manual upload)\n   - If using a connectivity partner: is the connection stable? Any sync failures?\n   - Feed update frequency: real-time, hourly, daily?\n   - Check for feed authentication errors or API key issues.\n   - Recommend the optimal feed method for the property count and tech stack.\n\n7. AI Bid Management Signals\n   - Hotel campaigns use AI-driven bidding (Maximise Conversions, Target ROAS).\n   - How does feed quality impact AI bidding decisions?\n   - Properties with complete feeds and real-time rates vs stale feeds \u2014 bid performance comparison.\n   - Check if rate competitiveness (feed rates vs competitor rates) is affecting AI bid strategy.\n   - Are room type-specific conversion values set up correctly for AI to optimise?\n\n8. Multi-Property Feed Management\n   - For hotel groups/chains: how is the feed structured across properties?\n   - Are property-level attributes (location, brand, amenities) differentiating correctly?\n   - Is there a master feed with property-level overrides?\n   - Flag properties with identical or near-identical feed data (copy-paste listings).\n   - Brand consistency across all property listings.\n\n9. Recommendations\n   - Property feed completeness fixes (specific properties, specific fields).\n   - Rate parity corrections and PMS sync improvements.\n   - Connectivity method optimisation.\n   - Room type and rate plan restructuring.\n   - Availability sync improvements.\n   - Max 8 recommendations ordered by expected booking impact.\n   Format: Professional with property-by-property status table, rate parity report, and prioritised action items.", "notes": "Requires Hotel Center access (separate from Merchant Center). Hotel campaigns use a different feed infrastructure. Verify Hotel Center account is linked to Google Ads before audit.", "prerun": "Requires Hotel Center access (separate from Merchant Center). Verify Hotel Center account exists before running."}, {"category": "\u26a0\ufe0f Analysis", "name": "Spend Pacing & Anomaly Detection", "prompt": "Analyse daily and weekly spend pacing across the account or selected campaigns. Identify spend anomalies, budget utilisation issues, and pacing irregularities that indicate configuration problems, auction shifts, or wasted budget.\n\nContext required:\n- Date range (minimum 14 days for meaningful weekly comparison, ideally 28+)\n- Account-level or specific campaign names (leave blank for account-wide)\n\n1. Daily Spend Trend\n   - Plot daily spend across the selected date range.\n   - Flag any single day where spend deviates more than \u00b130% from the trailing 7-day average.\n   - Identify the direction of each anomaly: spike (overspend) or drop (underspend).\n   - Note the exact date, spend amount, % deviation, and the trailing average for each flagged day.\n\n2. Day-over-Day Anomaly Detection\n   - Calculate day-over-day spend change for every day in the range.\n   - Flag days with >25% day-over-day swing as anomalous.\n   - For each anomaly, determine likely cause category:\n     - Budget change (daily budget increased/decreased)\n     - Bid strategy change (target CPA/ROAS adjusted, max CPC changed)\n     - Auction dynamics (competitor entered/exited, seasonal demand shift)\n     - Tracking/conversion delay (conversions attributed to wrong day)\n     - Feed or disapprovals (products dropped, ads paused)\n   - Cross-reference with any known account changes on those dates.\n\n3. Week-over-Week Comparison\n   - Aggregate spend by calendar week (Mon-Sun or Sun-Sat).\n   - Compare each week to the previous week and to the same week last month.\n   - Flag weeks with >20% spend shift that is not explained by day-count differences.\n   - Identify trend direction: accelerating spend, decelerating spend, or volatile.\n   - Include impressions, clicks, and conversions alongside spend to determine if spend changes are volume-driven or rate-driven.\n\n4. Budget Pacing Analysis\n   - For campaigns with shared or campaign-level budgets: is spend pacing evenly across the month/flight?\n   - Calculate expected daily spend (total budget / days in period) vs actual average daily spend.\n   - Identify front-loaded pacing (spending too fast early, will run out of budget) or back-loaded pacing (underspending, leaving budget on the table).\n   - Flag campaigns that are \"limited by budget\" on some days but not others.\n   - Check for weekend vs weekday spend skew \u2014 is it intentional or a pacing bug?\n\n5. Campaign-Level Pacing Breakdown\n   - For each campaign (or selected campaigns), show:\n     - Average daily spend\n     - Min/Max daily spend in the range\n     - Standard deviation of daily spend (volatility score)\n     - Pacing status: On track / Overspending / Underspending / Volatile\n   - Rank campaigns by volatility \u2014 highest volatility first.\n   - Flag campaigns where daily spend swings exceed 50% of the average \u2014 these are unstable.\n\n6. Hourly Spend Distribution (if data available)\n   - Check if spend is distributed evenly across hours or concentrated.\n   - Flag campaigns where >30% of daily spend occurs in a 4-hour window.\n   - Identify if hourly concentration is intentional (ad scheduling) or unexpected.\n   - Compare hourly patterns across weekdays vs weekends.\n\n7. Spend vs Conversion Pacing\n   - Are conversions pacing in line with spend, or is the cost per conversion changing?\n   - Flag days where spend spiked but conversions dropped (wasted spend event).\n   - Flag days where spend dropped but conversions held (potential underspend opportunity).\n   - Calculate daily CPA trend \u2014 is it stable, improving, or degrading?\n\n8. Anomaly Summary Table\n   - Consolidate all flagged anomalies into a single table:\n     - Date | Campaign | Spend | % Deviation | Likely Cause | Severity (Low/Medium/High)\n   - Sort by severity (High first), then by date.\n   - Provide a severity definition:\n     - High: >50% deviation or budget exhaustion risk\n     - Medium: 25-50% deviation or sustained trend\n     - Low: 25-50% deviation, single day, self-correcting\n\n9. Recommendations\n   - Specific budget adjustments for campaigns with pacing issues.\n   - Bid strategy tweaks for volatile campaigns.\n   - Ad schedule changes if hourly distribution is problematic.\n   - Budget reallocation if pacing reveals inefficiency.\n   - Monitoring setup: recommend automated alerts for future anomalies.\n   - Max 6 recommendations ordered by spend impact.\n   Format: Professional with daily spend table, week-over-week comparison, anomaly summary table with severity ratings, and clear action items.", "notes": "Minimum 14 days data for weekly comparison. 28+ days recommended. Can run account-wide or filter to specific campaigns.", "prerun": "Minimum 14 days data required for weekly comparison. 28+ days recommended for meaningful trends."}, {"category": "\u26a0\ufe0f Analysis", "name": "Targeted Audience Performance Analysis", "prompt": "Pull and categorise all targeted audience segments by performance across conversions, impressions, CTR, and cost. Group audiences by type and compare performance to identify top segments, underperformers, and expansion opportunities.\n\nContext required:\n- Date range (minimum 30 days for meaningful audience data, 60+ recommended)\n- Account-level or specific campaign names (leave blank for account-wide)\n- Primary conversion goal (lead gen CPA or ecommerce ROAS)\n\n1. Audience Segment Inventory\n   - List every audience segment currently applied to campaigns or ad groups.\n   - Categorise by audience type:\n     - Demographics (age, gender, household income, parental status)\n     - Affinity (lifestyle and interest-based)\n     - In-market (active purchase intent)\n     - Custom intent (keyword/URL-based audience)\n     - Remarketing (website visitors, app users, YouTube viewers, customer lists)\n     - Similar/Lookalike audiences\n     - Combined audiences\n   - For each segment: which campaigns/ad groups it is applied to, and whether it is set to Targeting or Observation.\n\n2. Performance by Audience Category\n   - Aggregate metrics by audience TYPE (not individual segment):\n     - Total impressions, clicks, CTR\n     - Total spend, conversions, CPA or ROAS\n     - Conversion rate\n   - Compare categories against each other: which audience type delivers the best CPA/ROAS?\n   - Compare categories against the account/campaign average.\n   - Present as a summary table: Category | Impressions | Clicks | CTR | Spend | Conversions | CPA/ROAS | vs Average.\n\n3. Individual Segment Deep Dive\n   - For each audience segment, show:\n     - Segment name and type\n     - Applied to: campaign(s) / ad group(s)\n     - Targeting mode: Targeting (restricts reach) vs Observation (bids on but doesn't restrict)\n     - Impressions, clicks, CTR\n     - Spend, conversions, CPA or ROAS\n     - Conversion rate\n   - Sort by conversions descending.\n   - Highlight segments with 0 impressions (audience too narrow or conflicting targeting).\n   - Highlight segments with impressions but 0 conversions (potential exclusion candidates).\n\n4. Demographic Performance Breakdown\n   - Age groups: 18-24, 25-34, 35-44, 45-54, 55-64, 65+, Unknown\n   - Gender: Male, Female, Unknown\n   - Household income: Top 10%, 11-20%, 21-30%, 31-40%, 41-50%, 51-60%, 61-70%, 71-80%, 81-90%, Lower 50%, Unknown\n   - For each demographic dimension: which segments overperform/underperform?\n   - Are bid adjustments applied to demographics? Are they helping or hurting?\n\n5. Remarketing List Performance\n   - List all remarketing audiences (site visitors, app users, YouTube, customer match).\n   - For each list: size, membership duration, recency window, performance metrics.\n   - Compare list sizes against minimum thresholds (lists <500 members cannot serve).\n   - Check membership duration: is it too broad (12+ months) or too narrow (7 days)?\n   - Are customer match lists uploading and refreshing regularly?\n   - Which remarketing lists have the best CPA/ROAS vs prospecting audiences?\n\n6. In-Market & Affinity Audience Analysis\n   - Which in-market categories are active and performing?\n   - Which affinity segments are delivering volume but not converting?\n   - Are there in-market segments relevant to the business that are NOT being used?\n   - Compare in-market (active buyers) vs affinity (interest-based) performance.\n   - Flag in-market segments with high spend and low conversions \u2014 may be wrong category.\n\n7. Audience Overlap & Efficiency\n   - Are multiple audience segments competing for the same impressions?\n   - Calculate audience overlap rate where data is available.\n   - Identify audiences that are subsets of each other (e.g., \"Shoes\" affinity AND \"Running Shoes\" in-market).\n   - Flag redundant segments that could be consolidated.\n   - Check if audience expansion settings are pulling in irrelevant traffic.\n\n8. Observation vs Targeting Mode Audit\n   - List all audiences and their targeting mode.\n   - For Observation-mode audiences: how do they perform vs the baseline (non-audience traffic)?\n   - Are there Observation audiences that should be promoted to Targeting (strong performers)?\n   - Are there Targeting audiences that should be demoted to Observation (weak performers)?\n   - This directly impacts reach and efficiency.\n\n9. Recommendations\n   - Audience segments to add (based on gaps in current targeting).\n   - Audience segments to exclude (high spend, no conversions).\n   - Targeting mode changes (Observation to Targeting and vice versa).\n   - Demographic bid adjustments to apply or remove.\n   - Remarketing list improvements (duration, size, refresh).\n   - List consolidation opportunities.\n   - Max 8 recommendations ordered by expected CPA/ROAS improvement.\n   Format: Professional with category summary table, segment-by-segment performance table, demographic breakdown, and prioritised action items.", "notes": "Minimum 30 days data. Uses campaign_audience_view and demographic segments from GAQL. Observation vs Targeting mode is critical \u2014 always include. Some audience types (PMax signals) have limited transparency.", "prerun": "API returns audience segment IDs (not names) \u2014 cross-reference in Google Ads UI for human-readable names. Minimum 30 days data."}, {"category": "\u26a0\ufe0f CRM Integration", "name": "Offline Conversion Import Audit", "prompt": "Audit offline conversion imports in Google Ads to verify CRM data is flowing correctly into the account for Smart Bidding optimisation. This prompt works with Google Ads API only \u2014 no CRM access required.\n\nContext required:\n- Date range (minimum 30 days to assess import health)\n- Account-level or specific conversion actions to check\n\n1. Offline Conversion Action Inventory\n   - List all conversion actions with source = \"IMPORT\" or \"WEBSITE\" that may receive offline data.\n   - For each: name, category, status, value setting, count setting, attribution model, import frequency.\n   - Flag conversion actions that appear to be offline imports but have source = \"WEBSITE\" (may be misconfigured).\n   - Identify which conversion actions are feeding Smart Bidding (primary vs secondary).\n\n2. Import Health Check\n   - For each offline import conversion action:\n     - Last import date and time\n     - Import frequency (daily, weekly, manual)\n     - Number of conversions imported in the last 30 days\n     - Any import errors or warnings in the last 30 days\n   - Flag imports that are stale (no import in >7 days for daily imports, >14 days for weekly).\n   - Flag conversion actions with zero imports in the last 30 days.\n\n3. Import Matching Accuracy\n   - Check if transaction IDs are being used for deduplication.\n   - Identify duplicate conversions (same transaction ID imported multiple times).\n   - Check for unmatched conversions (imports that didn't match to a click).\n   - Calculate match rate: matched imports / total imports.\n   - Low match rates indicate timing issues or missing GCLID data.\n\n4. Value Import Validation\n   - Are conversion values being imported correctly?\n   - Check for zero-value conversions (may indicate value field not mapped).\n   - Compare imported values against expected ranges for the business.\n   - Flag campaigns where imported values are significantly different from website conversion values.\n\n5. Timing Analysis\n   - How long between the offline event and the import?\n   - Are imports delayed by more than 24 hours (for daily imports)?\n   - Check if conversion windows are appropriate for the sales cycle length.\n   - For long sales cycles (B2B, high-value): are conversion windows too short (30 days) when deals take 60-90 days?\n\n6. Enhanced Conversions Check\n   - Is enhanced conversions for leads enabled?\n   - Are hashed customer data fields (email, phone) being passed?\n   - Check if enhanced conversions are complementing or conflicting with offline imports.\n\n7. Smart Bidding Impact Assessment\n   - Are offline conversions feeding the correct bidding strategy?\n   - Check if campaigns are optimising for the right conversion action (macro vs micro).\n   - Identify campaigns that would benefit from offline conversion data but don't have it.\n   - Flag campaigns using website-only conversions where offline imports would improve bidding.\n\n8. Recommendations\n   - Import schedule fixes (frequency, timing).\n   - Transaction ID implementation if missing.\n   - Value mapping corrections.\n   - Conversion window adjustments.\n   - Enhanced conversions setup.\n   - Max 8 recommendations ordered by bidding impact.\n   Format: Professional with import health dashboard, match rate analysis, and prioritised action items.", "notes": "No CRM access required \u2014 uses Google Ads API only. Check this BEFORE the CRM Integration Audit. Stale imports are the #1 cause of Smart Bidding underperformance in B2B accounts.", "prerun": "No CRM access required. Check this BEFORE the CRM Integration Audit. Stale imports are the #1 cause of Smart Bidding underperformance."}, {"category": "\u26a0\ufe0f CRM Integration", "name": "CRM-to-Ads Integration Audit", "prompt": "Audit the data flow between the client's CRM and Google Ads. Map how lead data flows from ad click to CRM record to closed deal, and identify gaps in the integration that hurt attribution and bidding.\n\nContext required:\n- CRM platform name (Salesforce, HubSpot, Zoho, Pipedrive, etc.)\n- Whether we have CRM API access (Yes/No)\n- Date range (minimum 30 days)\n- How offline conversions are currently being imported (manual upload, API, Zapier, third-party)\n\n1. Integration Method Mapping\n   - Document the current integration method:\n     - Manual CSV upload\n     - API-based im
