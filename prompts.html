port (Google Ads API or CRM API)\n     - Third-party connector (Zapier, Make, Funnel.io, etc.)\n     - Native CRM integration (Salesforce, HubSpot native)\n   - Map the data flow: CRM \u2192 [method] \u2192 Google Ads\n   - Identify each step and potential failure point.\n\n2. Conversion Action Mapping\n   - List all conversion actions that receive CRM data.\n   - For each: what CRM field/stage maps to this conversion action?\n   - Identify the full funnel:\n     - Top of funnel: Form submission, demo request, trial signup\n     - Mid funnel: Qualified lead, meeting booked, proposal sent\n     - Bottom of funnel: Closed-won, deal value\n   - Flag missing funnel stages (e.g., form fills tracked but closed deals not imported).\n\n3. Data Field Mapping\n   - What CRM fields are being imported to Google Ads?\n     - Transaction ID (for deduplication)\n     - Conversion value (deal amount)\n     - Conversion timestamp\n     - Currency code\n   - What CRM fields SHOULD be imported but aren't?\n   - Check for field mismatches (CRM field name vs Google Ads field name).\n\n4. GCLID Capture & Passback\n   - Is the GCLID (Google Click ID) being captured in the CRM?\n   - Is it being passed back to Google Ads with offline conversions?\n   - Check for GCLID capture failures (forms without GCLID field, CRM fields not storing GCLID).\n   - GCLID is required for offline import matching \u2014 without it, imports fail silently.\n\n5. Data Freshness & Latency\n   - How quickly does CRM data flow to Google Ads?\n   - Is there a lag between CRM stage changes and Google Ads conversion recording?\n   - Check for batch processing delays (weekly imports vs real-time).\n   - Identify the average time between CRM event and Google Ads import.\n\n6. Attribution Gap Analysis\n   - Compare website-tracked conversions vs CRM-imported conversions.\n   - Identify leads that appear in CRM but not in Google Ads (missing GCLID, import failures).\n   - Calculate the attribution gap: CRM leads - Google Ads matched leads.\n   - Large gaps indicate integration failures, not actual performance issues.\n\n7. Duplicate & Conflict Detection\n   - Are the same conversions being tracked both via website AND offline import?\n   - Check for double-counting (form fill counted as website conversion AND CRM import).\n   - Identify conversion actions that should be deduplicated.\n   - Verify count settings: \"Every\" vs \"One\" \u2014 mismatches cause inflation.\n\n8. Recommendations\n   - GCLID capture fixes (form changes, CRM field additions).\n   - Import method upgrades (manual \u2192 API).\n   - Missing funnel stage imports.\n   - Deduplication fixes.\n   - Data freshness improvements.\n   - Max 8 recommendations ordered by attribution impact.\n   Format: Professional with data flow diagram description, gap analysis table, and prioritised action items.", "notes": "Requires client to share CRM platform name and how they currently import offline data. If no CRM access, focus on what's visible in Google Ads (import health, match rates). If CRM access available, run Lead Quality vs Ad Spend next.", "prerun": "Requires client to share CRM platform name and import method. If no CRM access, focus on what's visible in Google Ads only."}, {"category": "\u26a0\ufe0f CRM Integration", "name": "Lead Quality vs Ad Spend Analysis", "prompt": "Analyse lead quality from the CRM against Google Ads spend to calculate true ROAS and identify campaigns that generate revenue vs those that generate noise. Requires CRM API access.\n\nContext required:\n- CRM platform and API credentials\n- Date range (minimum 60 days for meaningful closed-deal data)\n- Which CRM fields represent: lead source, deal stage, deal value, close date\n- Primary conversion goal in Google Ads\n\n1. CRM Data Pull\n   - Pull all leads/closed deals from the CRM for the date range.\n   - For each record: lead source (Google Ads), campaign, keyword, ad group, lead creation date, deal stage, deal value, close date.\n   - Filter to only Google Ads-sourced leads (match via UTM parameters, GCLID, or campaign name).\n   - Count total leads, qualified leads, and closed deals.\n\n2. Lead Quality by Campaign\n   - For each Google Ads campaign:\n     - Total leads generated\n     - Qualified leads (met qualification criteria in CRM)\n     - Closed deals\n     - Total deal value\n     - Lead-to-qualified rate\n     - Qualified-to-close rate\n     - Overall conversion rate (leads \u2192 closed deals)\n   - Rank campaigns by deal value, not lead volume.\n   - Flag campaigns with high lead volume but low close rates (vanity metrics).\n\n3. Lead Quality by Keyword\n   - Same analysis at keyword level for top-spending keywords.\n   - Identify keywords that generate high-quality leads vs low-quality.\n   - Compare keyword CPA (cost per lead) vs keyword CAC (cost per closed deal).\n   - Keywords with low CPA but high CAC are generating quantity, not quality.\n\n4. True ROAS Calculation\n   - For each campaign/keyword: true ROAS = deal value / ad spend.\n   - Compare true ROAS (closed deals) against Google Ads reported ROAS (form fills).\n   - Identify campaigns where Google Ads overreports ROAS (tracking form fills as conversions when they rarely close).\n   - Identify campaigns where Google Ads underreports ROAS (closing deals but not importing values).\n\n5. Lead Time Analysis\n   - How long from first click to closed deal?\n   - Compare lead time across campaigns and keywords.\n   - Are some campaigns generating faster-closing deals?\n   - Are conversion windows in Google Ads too short for the actual sales cycle?\n\n6. Lead Decay Analysis\n   - What percentage of leads from Google Ads go cold (never qualified, never closed)?\n   - At what point do leads typically go cold (7 days, 14 days, 30 days)?\n   - Are there campaigns where most leads go cold within 7 days? (May indicate wrong audience or misleading ads).\n   - Identify the optimal follow-up window for leads from each campaign type.\n\n7. Budget Reallocation Recommendations\n   - Based on true ROAS (not form-fill ROAS), which campaigns deserve more budget?\n   - Which campaigns should be paused or reduced?\n   - Calculate the revenue impact of reallocating 20% of budget from low-quality to high-quality campaigns.\n   - Present as a budget shift recommendation: Move $X from [Campaign A] to [Campaign B], expected revenue increase: $Y.\n\n8. Recommendations\n   - Campaign budget shifts based on lead quality data.\n   - Keyword-level bid adjustments based on close rates.\n   - Landing page or ad copy changes for campaigns with high volume but low quality.\n   - CRM field additions to capture more attribution data.\n   - Offline import improvements for better Smart Bidding.\n   - Max 8 recommendations ordered by revenue impact.\n   Format: Professional with campaign-level quality scorecard, true ROAS comparison table, and budget reallocation recommendations with dollar impact.", "notes": "Requires CRM API access with lead/deal data. Minimum 60 days for closed-deal analysis. If CRM access is not available, run Offline Conversion Import Audit and CRM-to-Ads Integration Audit first.", "prerun": "Requires CRM API access with lead/deal data. Minimum 60 days for closed-deal analysis. If no CRM access, run the other two CRM prompts first."}, {"category": "\u26a0\ufe0f Tracking", "name": "GTM Installation Verification", "prompt": "Verify that Google Tag Manager is correctly installed on the website before auditing container configuration. This is the first step \u2014 run BEFORE the GTM & Google Ads Tracking QA and GTM Container & Data Layer Troubleshoot prompts.\n\nContext required:\n- Website URL to check\n- GTM Container ID (if known \u2014 e.g., GTM-XXXXXXX)\n\n1. GTM Snippet Detection\n   - Check if a GTM script tag exists in the page source.\n   - Identify the GTM container ID from the snippet.\n   - Verify the container ID matches what the client says it should be.\n   - Flag if no GTM snippet is found (GTM not installed).\n   - Flag if multiple GTM snippets are found (possible duplicate containers).\n\n2. Snippet Placement\n   - Is the GTM `<script>` tag in the `<head>` section? (Correct placement)\n   - Is it in the `<body>` section? (Incorrect \u2014 causes delayed firing)\n   - Is it the first script in `<head>`? (Ideal \u2014 before other scripts)\n   - Check if the `<noscript>` iframe fallback is in the `<body>` immediately after the opening `<body>` tag.\n   - Flag missing `<noscript>` fallback (required for non-JS browsers and some tracking).\n\n3. Container Loading Verification\n   - Does the GTM container load without errors?\n   - Check for JavaScript errors in the console related to GTM.\n   - Is the container loading before or after other scripts?\n   - Check if GTM is being blocked by Content Security Policy (CSP) headers.\n   - Check if GTM is being blocked by ad blockers or privacy extensions (test with and without).\n\n4. Multiple Container Check\n   - Are there multiple GTM container IDs on the page?\n   - If yes, are they intentional (e.g., GTM for different properties) or accidental?\n   - Multiple containers can cause duplicate tracking, conflicting data layer pushes, and performance issues.\n   - List all GTM container IDs found on the page.\n\n5. Script Loading Order\n   - Map the loading order of all GTM-related scripts:\n     - GTM container snippet\n     - Google Analytics (GA4) tag\n     - Google Ads conversion tag\n     - Other third-party tags\n   - Flag if GA4 or Google Ads tags are loading BEFORE GTM (they should be managed BY GTM, not loaded independently).\n   - Flag if GTM is loading after DOMContentLoaded (too late for early events).\n\n6. Page Speed Impact\n   - Does GTM loading impact page load time?\n   - Check if GTM is render-blocking.\n   - Check the size of the GTM container (large containers with many tags slow down page load).\n   - Flag containers with >50 tags or >100 triggers (likely oversized).\n\n7. SSL/HTTPS Check\n   - Is the GTM snippet using HTTPS? (Required for secure sites)\n   - Flag HTTP GTM snippets on HTTPS pages (mixed content warning).\n   - Verify the GTM container URL is accessible over HTTPS.\n\n8. Data Layer Presence\n   - Is there a `dataLayer` object initialized on the page?\n   - Is it initialized BEFORE the GTM snippet? (Required \u2014 GTM reads from dataLayer on load)\n   - Check for `dataLayer.push()` events in the page source.\n   - Flag if dataLayer is not initialized (GTM will create one, but custom data won't be captured).\n\n9. If Errors Found \u2014 Data Layer Research Recommendations\n   - For each installation error found, provide:\n     - The specific error and where it was found\n     - The fix (code snippet if applicable)\n     - Whether the fix requires data layer changes\n   - If GTM is not installed: provide the full installation code for the client's platform (WordPress, Shopify, etc.).\n   - If dataLayer is missing: explain what data should be pushed and provide example dataLayer.push() code.\n   - If container is misconfigured: provide the corrected snippet.\n\n10. Recommendations\n    - Installation fixes (snippet placement, container ID correction).\n    - Data layer implementation (if missing or incorrect).\n    - Multiple container consolidation.\n    - Performance optimisation (container size, loading order).\n    - Platform-specific installation instructions if GTM needs to be reinstalled.\n    - Max 6 recommendations ordered by tracking impact.\n    Format: Professional with installation status dashboard (pass/fail for each check), code snippets for fixes, and clear action items.", "notes": "Run this FIRST before any other GTM prompts. If installation is broken, the other prompts will produce unreliable results. Check website platform (WordPress, Shopify, etc.) to provide platform-specific fix instructions.", "prerun": "Run this FIRST before any other GTM prompts. If installation is broken, the other GTM prompts will produce unreliable results. Check website platform to provide platform-specific fix instructions."}, {"category": "Analysis", "name": "Change Impact Analysis (Troubleshooting)", "prompt": "Show me recent changes in my account and their impact for [DATE RANGE].\n\nAnalysis structure:\n\n1. Change Log: What was changed, when, and by whom.\n\n2. Affected Entities: Identify the specific campaigns or ad groups where each change was made.\n\n3. Relevant KPIs: Pull the key metrics for those campaigns/ad groups (before vs after the change).\n\n4. Causation vs Correlation: For each change, assess whether the performance shift is likely caused by the change itself, or influenced by external factors (seasonality, different product mix, market trends, competitor activity, etc.).\n\n5. Positive Changes: What's working better since the change.\n\n6. Negative Changes: What got worse (flag for review).\n\nFocus on changes that moved the needle. Skip minor tweaks. Clearly distinguish between changes that directly drove results vs coincidental timing.\n\nFormat: Professional, clearly structured with headers and bullet points.", "notes": "Replace [DATE RANGE] with desired window. Requires change history access.", "prerun": "Ensure change history tracking is enabled. Account must have >30 days of data for meaningful before/after comparison."}, {"category": "Analysis", "name": "Policy & Disapproval Audit (Troubleshooting)", "prompt": "Scan the entire account for all currently disapproved, limited, or policy-flagged assets. Cover ads, keywords, images, ad extensions, and asset groups.\n\n1. Summary: Total flagged items by status (disapproved, eligible limited, under review). Break down by asset type (text ads, responsive search ads, image assets, keywords, sitelinks, etc.).\n\n2. Disapproved Assets: For each disapproved item list: the asset, the policy violation reason, and which campaign/ad group it belongs to. Group by policy type (e.g., misleading content, editorial, trademark, destination issues, restricted content). Prioritize by impact \u2014 flag items in high-spend campaigns first.\n\n3. Limited (Eligible Limited) Assets: Items restricted by policy but still partially serving (e.g., alcohol, healthcare, gambling policies). Explain what the limitation means \u2014 where/when the ad won't show.\n\n4. Fix Recommendations: For each disapproved or limited item, provide a specific fix:\n   - Ad copy violations \u2192 rewrite suggestion that complies with policy\n   - Keyword disapprovals \u2192 alternative keyword or match type\n   - Image rejections \u2192 what to change (text overlay %, resolution, content)\n   - Landing page issues \u2192 what to check on the destination URL\n   - Trademark flags \u2192 whether to request authorization or adjust copy\n\n5. Appeal Candidates: Flag items where the disapproval may be incorrect and worth appealing (e.g., false positive on editorial policy, generic trademark terms). Note: each ad gets max 3 appeals.\n\nOutput rules:\n\n- Lead with the most impactful issue (highest spend campaign affected).\n- Keep fix recommendations specific and actionable \u2014 not generic policy descriptions.\n- If no disapprovals found, confirm the account is clean and note any items under review.\n\nFormat: Concise, structured with tables for the asset list.", "notes": "Run when ads suddenly lose impressions or account health drops. Works best when pulled immediately after a campaign change or new ad launch.", "prerun": "Check account-level policy settings first. If restricted industry (health, finance, alcohol), pre-load industry-specific policy guidelines."}, {"category": "Analysis", "name": "Impression Share Loss Analysis (Troubleshooting)", "prompt": "Analyze impression share loss across all campaigns for [DATE RANGE].\n\nAnalysis structure:\n\n1. Impression Share Overview Table (per campaign): Total Impression Share, Lost IS (Rank), Lost IS (Budget), primary loss driver, recommended action (bid/quality/budget fix).\n\n2. Root Cause Breakdown: Campaigns limited by budget (pacing issues, cap timing), campaigns limited by rank (QS, bid competitiveness, ad relevance).\n\n3. Keyword-Level Drill-Down: Top/bottom converting keywords with ad rank, impressions, clicks, conversions, conversion rate, landing page performance signals.\n\n4. Actionable Recommendations: Specific bid adjustments for rank-limited campaigns, budget reallocation or increases for budget-limited campaigns, quality improvements (ad copy, landing page) for poor performers.\n\n5. Data Notes: Flag unavailable metrics or API limitations, process large datasets in chunks before aggregation.\n\nFormat: Professional, clearly structured with headers and bullet points.", "notes": "Replace [DATE RANGE] with desired window. Useful for diagnosing sudden drops in traffic or missed growth opportunities.", "prerun": "Ensure impression share columns are enabled in campaign view. Check if shared budgets are in use (affects budget loss attribution)."}, {"category": "Analysis", "name": "Geo & Audience Targeting Audit (Troubleshooting)", "prompt": "Audit the account's geographic targeting and audience targeting settings for [DATE RANGE]. Identify misconfigurations, wasted spend, and missed opportunities.\n\nContext required:\n- Business type (local, national, international, e-commerce, lead gen)\n- Target markets (which countries/cities/regions should be targeted)\n- Whether the business has physical locations (for local campaigns)\n\n1. Geographic Targeting Overview\n   - List all location targets by campaign: countries, regions, cities, radius targeting.\n   - Identify the targeting setting used per campaign: Presence only vs Presence or Interest.\n   - Flag campaigns using \"Presence or Interest\" for B2B or local businesses (causes wasted spend on people researching but not located in target areas).\n   - Check for location bid modifiers \u2014 are high-performing geos getting uplift? Are underperformers being suppressed?\n   - List any excluded locations and whether exclusions are comprehensive (e.g., are competitor HQ cities excluded for brand campaigns?).\n\n2. Geo Performance Analysis\n   - Break down performance by targeted location: impressions, clicks, CTR, conversions, CPA/ROAS.\n   - Identify top-performing locations (high conversions, low CPA) \u2014 these deserve more budget or bid uplift.\n   - Identify locations with spend but zero conversions \u2014 flag for review or exclusion.\n   - Check for geographic mismatches: locations targeted but showing ads to wrong areas (e.g., targeting \"South Africa\" but most clicks are from Gauteng when the business is Cape Town-based).\n   - For lead gen: are form fills and calls coming from target locations, or from excluded/outside areas?\n\n3. Audience Targeting Settings\n   - List all audience segments attached to each campaign: remarketing lists, in-market, affinity, custom audiences, customer match, similar audiences.\n   - For each audience: is it set to Observation or Targeting mode?\n   - Flag campaigns where high-value audiences (remarketing, customer match) are in Observation mode but should be in Targeting mode for focused spend.\n   - Flag campaigns where broad audiences (affinity, in-market) are in Targeting mode and limiting reach unnecessarily.\n   - Check audience bid adjustments \u2014 are remarketing lists getting bid uplift? Are cold audiences being suppressed?\n\n4. Audience Performance Analysis\n   - For each audience segment: impressions, clicks, CTR, conversions, CPA/ROAS.\n   - Identify audiences with high spend but no conversions \u2014 these are dragging performance.\n   - Identify high-converting audiences that are underutilised (small reach, no bid uplift).\n   - Check for audience overlap: are multiple audiences targeting the same users, causing internal competition and inflated CPCs?\n   - For PMax: are audience signals actually being used, or are they too broad to influence targeting?\n\n5. Audience-to-Geo Alignment\n   - Cross-reference geo and audience data: are the right audiences being shown in the right locations?\n   - Flag misalignments: e.g., targeting a national audience segment but only running in one city, or targeting a local audience but running geo-targeted campaigns nationally.\n   - Check if customer match lists are being used across all relevant campaigns, or only in some.\n\n6. Negative Audiences & Exclusions\n   - List any audience exclusions (e.g., existing customers excluded from acquisition campaigns).\n   - Flag missing exclusions: are converted users being excluded from top-of-funnel campaigns? Are employees or internal teams excluded?\n   - For remarketing: check audience membership duration \u2014 are you retargeting users from 6+ months ago who are unlikely to convert?\n\n7. Recommendations\n   - Geo fixes: location targeting adjustments, bid modifier recommendations, exclusion additions.\n   - Audience fixes: Observation vs Targeting mode changes, bid adjustment recommendations, audience segment additions/removals.\n   - Alignment fixes: cross-referencing geo and audience to eliminate waste.\n   - Max 8 recommendations ordered by expected CPA/ROAS impact.\n   Format: Professional, clearly structured with headers, tables, and bullet points. Use \u2705/\u274c/\u26a0\ufe0f status indicators for quick scanning.", "notes": "Replace [DATE RANGE] with desired window. Works for Search, Shopping, PMax, and Display campaigns.", "prerun": "Verify audience list membership is populating (check Audience Insights). If no audience data visible, confirm remarketing tags and audience list creation are active."}, {"category": "Analysis", "name": "Creative Asset Performance Audit (Troubleshooting)", "prompt": "Audit all creative assets across PMax, Display, and Responsive Display campaigns for [DATE RANGE]. Identify top and underperforming assets, disapproved content, and creative gaps.\n\nCampaign types to cover:\n- Performance Max (PMax) asset groups\n- Display campaigns (responsive display ads, uploaded image ads)\n- Demand Gen campaigns (image, video, carousel assets)\n\n1. Creative Asset Inventory\n   - List all asset types present per campaign/asset group: headlines, descriptions, long headlines, images (landscape, square, logo), videos, call-to-action text.\n   - Count total assets per type and flag asset groups with fewer than the recommended minimum (e.g., <5 headlines, <3 images, <1 video for PMax).\n   - Identify asset groups where Google is pinning or rarely serving certain assets (low asset coverage %).\n\n2. Image Asset Performance\n   - For each image asset: impressions, clicks, CTR, conversions, asset rating (Best/Good/Low/Unrated).\n   - Identify top-performing images (Best rating, high CTR) - these should be replicated or used as templates.\n   - Identify underperforming images (Low rating, low CTR) - recommend replacement.\n   - Check image specs: are all images meeting recommended sizes? (Landscape 1200x628, Square 1200x1200, Logo 1200x1200).\n   - Flag images with text overlay exceeding 20% (may cause disapproval or poor performance).\n   - For Display campaigns: check if uploaded image ads are responsive or static - static ads limit reach.\n\n3. Video Asset Performance\n   - For each video: views, view rate, CPV, quartile completion rates (25%, 50%, 75%, 100%), conversions, conversion value.\n   - Identify videos with high view rate but low completion (hook is good, content loses interest).\n   - Identify videos with high completion but low conversion (engaging but not driving action).\n   - Flag videos that are too long (>30s for bumper slots, >60s for standard slots).\n   - Check if videos have captions/subtitles (critical for mobile silent viewing).\n   - For PMax: are videos being served across all inventory, or only on YouTube?\n\n4. Text Asset Performance (Headlines and Descriptions)\n   - For RSAs and responsive display: which headlines/descriptions are performing best vs rarely served?\n   - Identify pinned headlines that are limiting Ad Strength.\n   - Check for asset exhaustion - headlines that have been shown too frequently (audience fatigue).\n   - Flag generic or weak headlines that do not include keywords, CTAs, or value props.\n\n5. Creative Fatigue Detection\n   - Compare asset performance over time: are top-performing assets declining in CTR or engagement?\n   - Identify asset groups where the same 2-3 assets carry 80%+ of impressions (creative concentration risk).\n   - Recommend refresh cadence: which assets need new variants based on performance decay.\n\n6. Disapproved and Flagged Assets\n   - List all disapproved or limited creative assets across all campaign types.\n   - Group by policy reason (text overlay, misleading content, restricted content, etc.).\n   - Provide specific fix recommendations for each disapproval.\n\n7. Creative Gaps and Recommendations\n   - What asset types are missing entirely? (e.g., no video in PMax, no square images for mobile).\n   - What asset types need more variety? (e.g., only 2 headlines in a responsive display ad).\n   - Specific new creative suggestions based on what is working (e.g., Top image shows product on white background - create 3 more variations with lifestyle context).\n   - Max 8 recommendations ordered by expected CTR/conversion impact.\n   Format: Professional with tables for asset performance, status indicators, and clear creative recommendations.", "notes": "Replace [DATE RANGE]. Requires asset-level reporting which is available via Google Ads UI and API for PMax/Display/Demand Gen.", "prerun": "Ensure asset reporting columns are enabled. For PMax, check that asset group level reporting is accessible (not just campaign level)."}, {"category": "Analysis", "name": "Video & YouTube Campaign Analysis (Troubleshooting)", "prompt": "Analyse video and YouTube campaign performance for [DATE RANGE]. Cover YouTube ads (in-stream, in-feed, shorts), Demand Gen video assets, and PMax video usage.\n\n1. Video Campaign Performance Overview\n   - Summary table per campaign: impressions, views, view rate, CPV, spend, conversions, conversion value, ROAS.\n   - Compare performance across YouTube campaign types: skippable in-stream, non-skippable, in-feed, bumper, YouTube Shorts.\n   - Identify which campaign type delivers the best view rate, lowest CPV, and highest conversion rate.\n\n2. View Rate and Completion Analysis\n   - Break down quartile completion rates (25%, 50%, 75%, 100%) per video and per campaign.\n   - Identify the optimal video length based on completion data (e.g., 15s videos complete at 80%, 60s videos drop to 30%).\n   - Flag videos where the majority of viewers drop off before 25% (weak hook/opening).\n   - Flag videos where 75%+ viewers complete but conversion rate is low (engaging content, weak CTA).\n\n3. Audience Engagement\n   - Break down performance by audience segment: remarketing, in-market, affinity, custom, demographics.\n   - Identify which audiences have the highest view rate and conversion rate.\n   - Check for audience overlap between video campaigns and other campaign types (Search, Display).\n   - Are video campaigns reaching new users (prospecting) or mostly re-engaging existing audiences?\n\n4. Bidding and Cost Efficiency\n   - Analyse CPV by campaign type, audience, and placement.\n   - Compare Target CPA vs Maximum CPV bidding performance.\n   - Identify campaigns with CPV above benchmark (>R0.50 for SA market) and diagnose why.\n   - Check for budget pacing issues - are video budgets being spent early in the day/week?\n\n5. Placement and Inventory Analysis\n   - Where are ads appearing: YouTube search, YouTube watch pages, YouTube Shorts, Google video partners (GVP)?\n   - Flag high spend on GVP placements with low view rates (often bot traffic or low-quality inventory).\n   - Check if Shorts placements are performing differently from standard in-stream.\n   - For in-stream skippable: what percentage of views are 30-second watched views vs skips?\n\n6. Creative-to-Audience Fit\n   - Which video creatives perform best with which audiences?\n   - Are the same videos being used across all audiences (one-size-fits-all), or are there audience-specific creatives?\n   - Recommend creative segmentation: e.g., Remarketing audience responds better to testimonial videos, while in-market audience responds better to product demo videos.\n\n7. YouTube-Specific Metrics\n   - Earned actions: subscribers gained, likes, shares, playlist additions from video ads.\n   - Brand lift metrics if available: ad recall, brand awareness, consideration lift.\n   - YouTube audience growth: are video campaigns building the channel subscriber base?\n\n8. Recommendations\n   - Campaign restructuring: which video campaigns to scale, pause, or restructure.\n   - Creative recommendations: optimal video length, format, and style based on performance data.\n   - Audience recommendations: which segments to target, exclude, or create new audiences for.\n   - Budget reallocation: shift spend from high-CPV/low-conversion to efficient video campaigns.\n   - Max 8 recommendations ordered by expected impact on views, engagement, or conversions.\n   Format: Professional with tables, quartile visualisations where possible, and status indicators.", "notes": "Replace [DATE RANGE]. YouTube-specific metrics (earned actions, brand lift) require YouTube account linking. Video asset data available via Google Ads API for video campaigns.", "prerun": "Ensure YouTube channel is linked to Google Ads account for full metric access. Check that video campaigns are using conversion tracking (not just view-based goals)."}]}, "GA4": {"icon": "\ud83d\udcca", "color": "#FF6D00", "prompts": [{"category": "\u26a0\ufe0f Analysis", "name": "GA4 Revenue & Conversion Analysis", "prompt": "Analyze GA4 monetization performance for [DATE RANGE].\n\nContext required:\n- GA4 property access or exported data (Traffic Acquisition report, key events, ecommerce events)\n- Date range (minimum 30 days for meaningful patterns)\n- Primary conversion actions (purchase, generate_lead, etc.)\n\nAnalysis structure:\n\n1. Revenue by Channel: For each traffic source/medium, pull: sessions, key events, conversions, revenue, conversion rate, revenue per session. Present as a ranked table sorted by revenue DESC.\n\n2. Top 5 Conversion Paths: Using the conversion paths report, identify the 5 highest-value paths (channel sequences leading to conversion). Show: path sequence, conversions, conversion value, path length (steps), time to conversion.\n\n3. Underperforming Channels: Identify channels with high traffic volume but low conversion rate or revenue per session. Flag channels where:\n   - Sessions > 10% of total but conversion rate < account average\n   - Sessions > 10% of total but revenue per session < 50% of top channel\n   Calculate the gap: sessions \u00d7 (account avg CVR - channel CVR) = missed conversions.\n\n4. Lowest-Performing Channel Deep Dive: For the worst-performing channel by conversion rate:\n   - Break down by device, geo, and landing page\n   - Identify where drop-off occurs (high bounce rate pages, low engagement)\n   - Compare user behavior vs top-performing channel (avg session duration, pages/session, events/session)\n\n5. Actionable Recommendations (max 5):\n   - For underperforming channels: specific tactical fixes (landing page optimization, audience targeting, bid adjustments for paid)\n   - For conversion path optimization: where to add touchpoints or improve assisted conversions\n   - Each recommendation with expected impact estimate\n\nOutput rules: Lead with the revenue table. Clearly separate channels that need budget reallocation from channels that need conversion optimization. Flag data quality issues (missing UTM tags, self-referrals inflating direct).\nFormat: Professional with tables, bold headers, and specific numbers.", "notes": "Requires GA4 property access. If using exported CSV, ensure columns include: Session source/medium, Sessions, Key events, Conversions, Revenue.", "prerun": "Verify ecommerce tracking is firing correctly (purchase events with value parameter). If no revenue data, the prompt still works for lead gen using conversion count instead."}, {"category": "\u26a0\ufe0f Analysis", "name": "GA4 User Behavior & Retention Analysis", "prompt": "Analyze user engagement and retention patterns in GA4 for [DATE RANGE].\n\nContext required:\n- GA4 property access or cohort/retention report export\n- Date range (minimum 90 days for retention trends, 30 days minimum for engagement analysis)\n- Known user lifecycle stages (if applicable)\n\nAnalysis structure:\n\n1. Engagement Overview: Pull key metrics: engaged sessions, engagement rate, avg engagement time, engaged sessions per user, events per session. Compare month-over-month trend. Flag any significant drops (>15% decline).\n\n2. Cohort Retention Analysis:\n   - For each monthly cohort: Week 0 retention, Week 1 retention, Week 4 retention, Week 12 retention\n   - Calculate the retention curve shape: steep initial drop vs gradual decline\n   - Compare retention across acquisition channels \u2014 which channels bring the most loyal users?\n   - Identify the day/time when users typically stop returning (the \"danger zone\")\n\n3. User Journey Drop-Off Points:\n   - Using path exploration or funnel data, identify the top 3 drop-off points:\n     - Page/screen where users leave most frequently\n     - Event sequence where users abandon before completing\n     - Time-based drop-off (users active in first X days, then churn)\n   - For each drop-off point: volume affected (% of users), possible causes, severity ranking\n\n4. Engagement by User Segment:\n   - New vs returning users: engagement and retention comparison\n   - By traffic source: which sources bring users who stay vs bounce\n   - By device: mobile vs desktop engagement differences\n   - By geography: retention patterns by location\n\n5. UX & Content Improvement Recommendations (max 5-7):\n   - For each identified drop-off point: specific improvement suggestion\n   - Prioritize by impact: fixes affecting >20% of users first\n   - Include expected retention lift estimate where possible\n   - Suggestions should be actionable: not \"improve content\" but \"add exit-intent popup on /pricing with [specific offer]\" or \"reduce form fields from 8 to 4 on signup page\"\n\nOutput rules: Lead with the retention curve summary. Focus on the first 7-14 days where most drop-off happens. Separate engagement issues (users visit but don't convert) from retention issues (users don't return). Flag if data shows insufficient volume for statistical significance.\nFormat: Professional with cohort tables, retention curve description, and prioritized recommendations.", "notes": "Requires GA4 property with at least 30 days of data. Retention analysis needs 90+ days for meaningful trends. If cohort data is unavailable, focus on engagement metrics and path exploration.", "prerun": "Verify engagement events are tracking correctly. If engagement rate is suspiciously high (>90%), check for bot traffic or misconfigured engagement thresholds."}, {"category": "\u26a0\ufe0f Analysis", "name": "GA4 Organic vs Paid Traffic Budget Analysis", "prompt": "Compare organic and paid traffic performance in GA4 to inform budget allocation decisions for [DATE RANGE].\n\nContext required:\n- GA4 property access with UTM-tagged campaigns visible\n- Date range (minimum 30 days, 90 days preferred for trend analysis)\n- Known marketing channels (which are paid vs organic)\n- Business goals (lead gen CPA target or ecommerce ROAS target)\n\nAnalysis structure:\n\n1. Channel Performance Comparison Table:\n   For each channel (organic search, paid search, organic social, paid social, direct, referral, email):\n   - Sessions, engaged sessions, engagement rate\n   - Conversions, conversion rate, revenue (if ecommerce)\n   - Cost data (if available via GA4 cost import or manual input)\n   - CPA (cost / conversions) or ROAS (revenue / cost)\n   - Avg session duration, pages per session\n   - Key events per session (engagement depth)\n\n2. Efficiency Analysis:\n   - Rank channels by CPA (lowest to highest) \u2014 which channels convert most efficiently?\n   - Rank channels by ROAS (highest to lowest) \u2014 which channels generate most revenue per dollar?\n   - Identify channels with high engagement but low conversion (awareness channels that need conversion optimization)\n   - Identify channels with low engagement but high conversion (high-intent channels that could scale)\n\n3. Organic Channel Deep Dive:\n   - Organic search: landing pages driving organic traffic, keyword clusters (if Search Console linked), organic conversion paths\n   - Organic social: which platforms drive engaged traffic, social-to-conversion lag time\n   - Direct: what portion is likely branded search or returning users vs untracked campaigns\n   - Referral: which referring domains drive value, partnership opportunities\n\n4. Paid Channel Deep Dive:\n   - Paid search: branded vs non-branded performance, campaign-level CPA/ROAS\n   - Paid social: platform-level performance, creative fatigue indicators\n   - Display/programmatic: view-through vs click-through conversions, brand safety concerns\n   - Note: If cost data is not in GA4, request Google Ads cost import or manual cost input\n\n5. Budget Reallocation Recommendations:\n   - Specific shift recommendations: \"Move $X/month from [Channel A] to [Channel B] because [data-backed reason]\"\n   - Calculate projected impact: if budget shifts, expected change in conversions/revenue\n   - Identify scaling opportunities: channels with room to grow (low CPA, high volume potential)\n   - Identify efficiency opportunities: channels where conversion rate optimization could improve ROAS without increasing spend\n   - Max 5-7 recommendations with dollar amounts or percentage shifts\n\nOutput rules: Lead with the comparison table. Separate \"stop sp // ── Google Sign-in (Auth Code Flow) ──
function googleSignIn() {
  // Auth code flow — redirects to Google, returns with code → exchanged server-side
  const params = new URLSearchParams({
    client_id: '434324143090-9s9jstsfbgf2pqfk0tfmtpj8rihhmgrp.apps.googleusercontent.com',
    redirect_uri: window.location.origin + window.location.pathname,
    response_type: 'code',
    scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
    access_type: 'offline',
    prompt: 'select_account'
  });
  // Check for code query param (OAuth callback)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('code')) {
    handleAuthCode(urlParams.get('code'));
    return;
  }
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

async function handleAuthCode(code) {
  const authStatus = document.getElementById('authStatus');
  authStatus.textContent = '⏳ Exchanging token...';
  try {
    const res = await fetch('/.netlify/functions/auth-exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code,
        redirect_uri: window.location.origin + window.location.pathname
      })
    });
    const data = await res.json();
    if (!res.ok) {
      authStatus.textContent = '❌ Auth failed: ' + (data.error || 'unknown');
      return;
    }
    const ALLOWED = new Set(['pbs@tmicollective.com']);
    if (!ALLOWED.has(data.user.email)) {
      authStatus.textContent = '❌ Access restricted';
      return;
    }
    localStorage.setItem('tmai_token', data.access_token);
    localStorage.setItem('tmai_user', JSON.stringify(data.user));
    // Clean URL — remove auth params
    window.history.replaceState({}, '', window.location.pathname);
    showApp(data.user);
  } catch (e) {
    authStatus.textContent = '❌ ' + e.message;
  }
}

function signOut() {
  localStorage.removeItem('tmai_token');
  localStorage.removeItem('tmai_user');
  location.reload();
}

function checkAuth() {
  const user = localStorage.getItem('tmai_user');
  if (user) { showApp(JSON.parse(user)); return; }
  // Check query params on load (OAuth callback with code)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('code')) handleAuthCode(urlParams.get('code'));
}

function showApp(user) {
  document.getElementById('signIn').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userEmail').textContent = user.email;
  renderChannels();
  loadAccounts();
  selectChannel('Google Ads');
}

      renderAccountList();

    // Fallback to hardcoded list
    accountsList = getMCCAccountData();
    renderAccountList();

    groups[cat] = (groups[cat] || 0) + 1;

  // "All" pill first
  let html = `<div class="cat-pill${!currentCategory ? ' active' : ''}" onclick="selectCategory(null)">All <span class="pill-count">${prompts.length}</span></div>`;

function renderDatePresets() {

function getDateRange() {
  if (selectedDays === 'custom') {

    const to = document.getElementById('dateTo').value;
    if (from && to) return `${from} to ${to}`;
    return 'custom range (not set)';
  }
  return `last ${selectedDays} days`;
}

function closeModal() {

function copyPrompt() {
  if (!currentPrompt) return;
  let text = `[${currentPrompt.category}] ${currentPrompt.name}`;
  if (currentAccount) {
    text += ` — ${currentAccount.name} (${currentAccount.id})`;
  }
  text += `\n\n${currentPrompt.prompt}`;
  if (currentPrompt.notes) text += `\n\nNotes: ${currentPrompt.notes}`;
  if (currentPrompt.prerun) text += `\n\nPre-run: ${currentPrompt.prerun}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">check</span> Copied!';
    setTimeout(() => { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">content_copy</span> Copy'; }, 2000);

function executePrompt() {
  const btn = document.getElementById('btnExecute');

  if (!currentPrompt) return;
  if (!currentAccount) {
    status.textContent = '⚠️ Please select an account first';

  const dateRange = getDateRange();
  const days = selectedDays === 'custom' ? '7' : selectedDays;

  btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">open_in_new</span> Execute';
}
